<svg xmlns="http://www.w3.org/2000/svg" width="320" height="400" viewBox="0 0 320 400" role="img" aria-labelledby="t d"><title id="t">枚方の事件、把握と検証の時系列</title><desc id="d">2026年1月に市から児相へ虐待疑いの情報が共有され要保護児童に認定、8月に女児が死亡、11月17日に府知事が第三者検証を指示した。判断の詳しい経緯は検証中。</desc><rect width="320" height="400" rx="14" fill="#f3f6f4"/><g fill="#1d3431" font-family="sans-serif"><text x="20" y="32" font-size="19" font-weight="bold">把握から検証まで</text><text x="20" y="57" font-size="16">2026年・間隔は期間に非比例</text><line x1="34" x2="34" y1="91" y2="292" stroke="#2b7360" stroke-width="4"/><circle cx="34" cy="101" r="7" fill="#2b7360"/><circle cx="34" cy="193" r="7" fill="#2b7360"/><circle cx="34" cy="285" r="7" fill="#2b7360"/><text x="54" y="98" font-size="17" font-weight="bold">1月</text><text x="54" y="122" font-size="16">市から児相へ疑いを共有</text><text x="54" y="145" font-size="16">要保護児童に認定</text><text x="54" y="190" font-size="17" font-weight="bold">8月</text><text x="54" y="214" font-size="16">女児が死亡</text><text x="54" y="282" font-size="17" font-weight="bold">11月17日</text><text x="54" y="306" font-size="16">府知事が第三者検証を指示</text><text x="20" y="351" font-size="16">一時保護しなかった判断の</text><text x="20" y="375" font-size="16">詳しい経緯は検証を待つ。</text></g></svg>

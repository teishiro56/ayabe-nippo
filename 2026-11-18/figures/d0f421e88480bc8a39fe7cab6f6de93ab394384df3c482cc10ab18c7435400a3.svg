<text x="24" y="318">0</text><text x="88" y="318">10</text><text x="152" y="318">20</text><text x="216" y="318">30</text><text x="280" y="318">40</text>
</g>
<text x="20" y="357" font-size="19" font-weight="700">出力</text>

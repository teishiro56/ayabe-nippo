<text x="24" y="383">Astra</text><text x="280" y="383" text-anchor="end">40ドル</text>
<text x="24" y="453">Sol</text><text x="280" y="453" text-anchor="end">10ドル</text>
</g>
<rect x="24" y="394" width="256" height="31" fill="#176B54"/>
<rect x="24" y="464" width="64" height="31" fill="#486A94"/>

<text x="24" y="524">0</text><text x="88" y="524">10</text><text x="152" y="524">20</text><text x="216" y="524">30</text><text x="280" y="524">40</text>
</g>
<text x="20" y="563" font-size="16">入力・出力とも同じ0〜40の目盛。</text>
<text x="20" y="590" font-size="16">キャッシュ入力の別料金は</text>
<text x="20" y="617" font-size="16">この比較に含めていません。</text>

<text x="24" y="177">Astra</text><text x="280" y="177" text-anchor="end">8ドル</text>
<text x="24" y="247">Sol</text><text x="280" y="247" text-anchor="end">2ドル</text>
</g>
<rect x="24" y="188" width="51.2" height="31" fill="#176B54"/>
<rect x="24" y="258" width="12.8" height="31" fill="#486A94"/>

<svg xmlns="http://www.w3.org/2000/svg" width="320" height="738" viewBox="0 0 320 738" role="img" aria-labelledby="title desc" lang="ja">
<title id="title">GPT-6.2 AstraとSolのAPI標準料金比較</title>
<desc id="desc">100万トークン当たり米ドル。通常入力はAstraが8ドル、Solが2ドル。出力はAstraが40ドル、Solが10ドル。全棒グラフは0から40ドルの共通目盛。キャッシュ入力の別料金は含まない。出典はOpenAIのモデル紹介記事。</desc>
<rect width="320" height="738" rx="14" fill="#F4F7F5"/>
<g font-family="Noto Sans CJK JP, sans-serif" fill="#17362F">
<text x="20" y="36" font-size="17" font-weight="700">GPT-6.2 Astra / Sol</text>
<text x="20" y="69" font-size="23" font-weight="700">API標準料金を比較</text>
<text x="20" y="102" font-size="16">単位：米ドル／100万トークン</text>
<text x="20" y="145" font-size="19" font-weight="700">入力（通常）</text>
<g stroke="#CCD8D1" stroke-width="1">
<path d="M24 184V296 M88 184V296 M152 184V296 M216 184V296 M280 184V296"/>
<path d="M24 390V502 M88 390V502 M152 390V502 M216 390V502 M280 390V502"/>
</g>

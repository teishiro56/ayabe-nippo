<svg xmlns="http://www.w3.org/2000/svg" width="360" height="810" viewBox="0 0 360 810" role="img"><rect width="360" height="810" fill="#f3f6fa"/><g font-family="Noto Sans CJK JP,sans-serif" fill="#13253c"><text x="20" y="38" font-size="22" font-weight="700">水星を調べる、日欧の2機</text><text x="20" y="70" font-size="15" font-weight="400">接近から分離までの運用計画</text><text x="20" y="112" font-size="17" font-weight="700">連結したまま周回軌道へ</text><text x="20" y="140" font-size="14" font-weight="400">投入操作の開始予定：11月22日 03:24（日本）</text><text x="20" y="165" font-size="14" font-weight="400">この図は投入成功を示すものではない。</text><rect x="147" y="206" width="68" height="36" rx="4" fill="#8bbfca"/><text x="155" y="231" font-size="16" font-weight="700">みお</text><rect x="147" y="245" width="68" height="40" rx="4" fill="#dcb78a"/><text x="155" y="271" font-size="16" font-weight="700">MPO</text><path d="M125,302 L236,302" fill="none" stroke="#5a718b" stroke-width="2"/><text x="20" y="337" font-size="17" font-weight="700">12月10日ごろ、分離予定</text><path d="M180,350 L180,385" fill="none" stroke="#5a718b" stroke-width="2"/><path d="M100,385 L260,385" fill="none" stroke="#5a718b" stroke-width="2"/><path d="M100,385 L100,416" fill="none" stroke="#5a718b" stroke-width="2"/><path d="M260,385 L260,416" fill="none" stroke="#5a718b" stroke-width="2"/><rect x="17" y="429" width="158" height="201" rx="4" fill="#dbeef0"/><rect x="185" y="429" width="158" height="201" rx="4" fill="#f4e7d8"/><text x="29" y="462" font-size="16" font-weight="700">みお（JAXA）</text><text x="197" y="462" font-size="16" font-weight="700">MPO（ESA）</text><text x="29" y="500" font-size="15" font-weight="700">水星の周り</text><text x="197" y="500" font-size="15" font-weight="700">表面と内部</text><text x="29" y="528" font-size="14" font-weight="400">磁場と太陽風の</text><text x="197" y="528" font-size="14" font-weight="400">地形や物質の</text><text x="29" y="553" font-size="14" font-weight="400">相互作用を観測</text><text x="197" y="553" font-size="14" font-weight="400">分布などを観測</text><text x="29" y="596" font-size="14" font-weight="400">細長い周回軌道</text><text x="197" y="596" font-size="14" font-weight="400">より低い周回軌道</text><text x="20" y="669" font-size="15" font-weight="700">本格観測の開始予定は2027年春。</text><text x="20" y="702" font-size="13" font-weight="400">機体は記号。実物・軌道の形と縮尺は省略。</text><text x="20" y="744" font-size="13" font-weight="400">出典：ESA 到着日程、JAXA ミッション</text><text x="20" y="774" font-size="13" font-weight="400">作図：アヤベ日報</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="790" viewBox="0 0 360 790" role="img"><rect width="360" height="790" fill="#f3f6fa"/><g font-family="Noto Sans CJK JP,sans-serif" fill="#13253c"><text x="20" y="38" font-size="22" font-weight="700">首里城正殿、外から中へ</text><text x="20" y="69" font-size="15" font-weight="400">焼失から一般公開まで</text><path d="M37,111 L37,579" fill="none" stroke="#718897" stroke-width="3"/><circle cx="37" cy="120" r="7" fill="#bc704b" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="57" y="124" font-size="16" font-weight="700">2019年10月　火災</text><text x="57" y="150" font-size="14" font-weight="400">正殿などが焼失</text><circle cx="37" cy="303" r="7" fill="#bc704b" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="57" y="307" font-size="16" font-weight="700">2022年11月　本体工事着工</text><text x="57" y="333" font-size="14" font-weight="400">準備・木材の調達を経て工事へ</text><circle cx="37" cy="463" r="7" fill="#bc704b" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="57" y="467" font-size="16" font-weight="700">2025年7月　外観が完成</text><text x="57" y="493" font-size="14" font-weight="400">内部や防火設備の工事は継続</text><circle cx="37" cy="567" r="7" fill="#bc704b" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="57" y="571" font-size="16" font-weight="700">2026年11月　完成式と公開へ</text><text x="57" y="597" font-size="14" font-weight="400">下は2日間を拡大した表示</text><path d="M20,617 L340,617" fill="none" stroke="#becbd5" stroke-width="1"/><text x="20" y="647" font-size="17" font-weight="700">22日　完成式</text><text x="187" y="647" font-size="17" font-weight="700">23日　一般公開</text><text x="20" y="673" font-size="14" font-weight="400">式典の開催予定</text><text x="187" y="673" font-size="14" font-weight="400">内部は日時予約制</text><text x="20" y="712" font-size="14" font-weight="400">正殿の公開で、首里城全体の復元が</text><text x="20" y="735" font-size="14" font-weight="400">終わるわけではない。</text><text x="20" y="765" font-size="13" font-weight="400">出典：沖縄総合事務局・首里城公園</text><text x="242" y="765" font-size="12" font-weight="400">作図：アヤベ日報</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780" role="img"><rect width="360" height="780" fill="#f3f6fa"/><g font-family="Noto Sans CJK JP,sans-serif" fill="#13253c"><text x="20" y="35" font-size="22" font-weight="700">千秋楽、優勝の4通り</text><text x="20" y="65" font-size="14" font-weight="400">大の里・若元春12勝2敗、熱海富士11勝3敗</text><text x="20" y="96" font-size="13" font-weight="400">左：若元春 対 熱海富士　上：大の里 対 豊昇龍</text><text x="110" y="142" font-size="15" font-weight="700">大の里 勝ち</text><text x="235" y="142" font-size="15" font-weight="700">大の里 負け</text><rect x="98" y="158" width="115" height="161" rx="4" fill="#e0edf1"/><rect x="223" y="158" width="115" height="161" rx="4" fill="#e7efda"/><rect x="98" y="342" width="115" height="161" rx="4" fill="#e7efda"/><rect x="223" y="342" width="115" height="161" rx="4" fill="#f5e7da"/><text x="17" y="201" font-size="15" font-weight="700">若元春</text><text x="17" y="226" font-size="15" font-weight="700">勝ち</text><text x="17" y="385" font-size="15" font-weight="700">熱海富士</text><text x="17" y="410" font-size="15" font-weight="700">勝ち</text><text x="108" y="191" font-size="15" font-weight="700">2人決定戦</text><text x="108" y="230" font-size="14" font-weight="400">大の里</text><text x="108" y="255" font-size="14" font-weight="400">若元春</text><text x="108" y="292" font-size="14" font-weight="400">13勝2敗</text><text x="233" y="191" font-size="15" font-weight="700">単独優勝</text><text x="233" y="230" font-size="14" font-weight="400">若元春</text><text x="233" y="292" font-size="14" font-weight="400">13勝2敗</text><text x="108" y="375" font-size="15" font-weight="700">単独優勝</text><text x="108" y="414" font-size="14" font-weight="400">大の里</text><text x="108" y="476" font-size="14" font-weight="400">13勝2敗</text><text x="233" y="375" font-size="15" font-weight="700">3人決定戦</text><text x="233" y="410" font-size="14" font-weight="400">大の里</text><text x="233" y="434" font-size="14" font-weight="400">若元春</text><text x="233" y="457" font-size="14" font-weight="400">熱海富士</text><text x="233" y="484" font-size="14" font-weight="400">12勝3敗</text><text x="20" y="550" font-size="15" font-weight="700">若元春が勝てば熱海富士は届かない。</text><text x="20" y="580" font-size="15" font-weight="400">熱海富士が勝ち大の里が敗れると、</text><text x="20" y="608" font-size="15" font-weight="400">3人が12勝で並ぶ。</text><path d="M20,640 L340,640" fill="none" stroke="#c4ced8" stroke-width="1"/><text x="20" y="669" font-size="14" font-weight="400">21日終了時点。22日の結果ではない。</text><text x="20" y="699" font-size="13" font-weight="400">出典：日本相撲協会 成績、日刊スポーツ</text><text x="20" y="733" font-size="13" font-weight="400">作図：アヤベ日報</text></g></svg>
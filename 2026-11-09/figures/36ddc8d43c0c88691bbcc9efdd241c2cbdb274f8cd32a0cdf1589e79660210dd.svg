<svg xmlns="http://www.w3.org/2000/svg" width="360" height="895" viewBox="0 0 360 895" role="img" aria-labelledby="title desc">
<title id="title">バークシャーの営業利益の増減要因</title>
<desc id="desc">2025年7～9月期の13485百万ドルから、保険引受で1017、保険運用で447減少。鉄道280、エネルギー123、製造等426の増益を加え、その他145の減益を差し引き、2026年7～9月期は12705百万ドル。横軸は11000から14000を拡大表示。</desc>

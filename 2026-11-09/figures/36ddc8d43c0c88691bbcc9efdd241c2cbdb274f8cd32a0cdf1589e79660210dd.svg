<text x="20" y="62" font-size="20" font-weight="700">他の事業が一部相殺</text>
<text x="20" y="91" font-size="16">バークシャー／7～9月期</text>
<text x="20" y="116" font-size="14">単位：百万米ドル（税引き後）</text>
<text x="20" y="138" font-size="14">横軸は11,000～14,000を拡大表示</text>


<svg xmlns="http://www.w3.org/2000/svg" width="360" height="675" viewBox="0 0 360 675" role="img"><title>電子対を作ることと位相がそろうことは別</title><desc>上は電子対があるが位相が不揃い。下は電子対の位相がそろう。時計の針は位相の模式表現で、電子の進行方向やスピンではない。室温で超伝導を達成した図ではない。</desc><rect width="360" height="675" fill="#f1eee5"/><g font-family="Noto Sans CJK JP,sans-serif" fill="#243c39"><text x="20" y="32" font-size="20" font-weight="700">「ペア」と「歩調」は別の条件</text><text x="20" y="63" font-size="16" >電子対形成だけでは、超伝導にならない。</text><text x="20" y="105" font-size="18" font-weight="700">電子は対になるが、位相が不揃い</text><ellipse cx="70" cy="153" rx="35" ry="23" fill="#d6e2db" stroke="#396e61" stroke-width="2"/><circle cx="58" cy="153" r="7" fill="#396e61"/><circle cx="82" cy="153" r="7" fill="#396e61"/><circle cx="70" cy="218" r="21" fill="none" stroke="#667a74" stroke-width="1.5"/><path d="M70 218l0.00 -15.00" stroke="#a16536" stroke-width="3"/><circle cx="70" cy="218" r="3" fill="#a16536"/><ellipse cx="180" cy="153" rx="35" ry="23" fill="#d6e2db" stroke="#396e61" stroke-width="2"/><circle cx="168" cy="153" r="7" fill="#396e61"/><circle cx="192" cy="153" r="7" fill="#396e61"/><circle cx="180" cy="218" r="21" fill="none" stroke="#667a74" stroke-width="1.5"/><path d="M180 218l14.10 -5.13" stroke="#a16536" stroke-width="3"/><circle cx="180" cy="218" r="3" fill="#a16536"/><ellipse cx="290" cy="153" rx="35" ry="23" fill="#d6e2db" stroke="#396e61" stroke-width="2"/><circle cx="278" cy="153" r="7" fill="#396e61"/><circle cx="302" cy="153" r="7" fill="#396e61"/><circle cx="290" cy="218" r="21" fill="none" stroke="#667a74" stroke-width="1.5"/><path d="M290 218l7.50 12.99" stroke="#a16536" stroke-width="3"/><circle cx="290" cy="218" r="3" fill="#a16536"/><text x="20" y="263" font-size="15" >針の向きは「位相」の模式表現</text><text x="20" y="295" font-size="18" font-weight="700">電子対の位相がそろう</text><ellipse cx="70" cy="343" rx="35" ry="23" fill="#d6e2db" stroke="#396e61" stroke-width="2"/><circle cx="58" cy="343" r="7" fill="#396e61"/><circle cx="82" cy="343" r="7" fill="#396e61"/><circle cx="70" cy="408" r="21" fill="none" stroke="#667a74" stroke-width="1.5"/><path d="M70 408l5.13 -14.10" stroke="#a16536" stroke-width="3"/><circle cx="70" cy="408" r="3" fill="#a16536"/><ellipse cx="180" cy="343" rx="35" ry="23" fill="#d6e2db" stroke="#396e61" stroke-width="2"/><circle cx="168" cy="343" r="7" fill="#396e61"/><circle cx="192" cy="343" r="7" fill="#396e61"/><circle cx="180" cy="408" r="21" fill="none" stroke="#667a74" stroke-width="1.5"/><path d="M180 408l5.13 -14.10" stroke="#a16536" stroke-width="3"/><circle cx="180" cy="408" r="3" fill="#a16536"/><ellipse cx="290" cy="343" rx="35" ry="23" fill="#d6e2db" stroke="#396e61" stroke-width="2"/><circle cx="278" cy="343" r="7" fill="#396e61"/><circle cx="302" cy="343" r="7" fill="#396e61"/><circle cx="290" cy="408" r="21" fill="none" stroke="#667a74" stroke-width="1.5"/><path d="M290 408l5.13 -14.10" stroke="#a16536" stroke-width="3"/><circle cx="290" cy="408" r="3" fill="#a16536"/><text x="20" y="453" font-size="15" >針の向きは「位相」の模式表現</text><text x="20" y="495" font-size="16" >今回の測定：擬ギャップのエネルギーと</text><text x="20" y="520" font-size="16" >電子対形成が始まるエネルギーが</text><text x="20" y="545" font-size="16" >一致する証拠。</text><text x="20" y="580" font-size="16" >実測画像・実際の電子軌道ではない。</text><text x="20" y="605" font-size="16" >針は進行方向やスピンを表さない。</text><text x="20" y="630" font-size="16" >室温で抵抗ゼロを達成した図ではない。</text><text x="20" y="661" font-size="14" >ユトレヒト大学等の説明より編集部作図</text></g></svg>

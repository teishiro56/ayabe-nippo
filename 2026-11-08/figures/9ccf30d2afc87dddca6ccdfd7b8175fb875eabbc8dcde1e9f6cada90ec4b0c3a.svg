<svg xmlns="http://www.w3.org/2000/svg" width="360" height="870" viewBox="0 0 360 870" role="img"><title>ニュージーランドの暫定議席、選挙区と名簿</title><desc>国民党42議席はすべて選挙区。労働党36議席は選挙区21と名簿15。現与党3党は67、その他64、暫定総数131。</desc><rect width="360" height="870" fill="#f1eee5"/><g font-family="Noto Sans CJK JP,sans-serif" fill="#243c39"><text x="20" y="32" font-size="20" font-weight="700">票の首位と、議席の首位が違う</text><text x="20" y="61" font-size="17" >2026年総選挙・暫定集計</text><text x="20" y="94" font-size="17" >政党票：労働党が3,650票多い</text><rect x="20" y="113" width="18" height="18" fill="#396e61"/><text x="45" y="128" font-size="16" >選挙区</text><rect x="150" y="113" width="18" height="18" fill="#c6a166"/><text x="175" y="128" font-size="16" >名簿</text><text x="20" y="165" font-size="16" >国民党</text><text x="333" y="165" font-size="16" text-anchor="end">42議席</text><rect x="20" y="173" width="273.0" height="18" fill="#396e61"/><text x="20" y="209" font-size="14" >選挙区 42 ＋ 名簿 0</text><text x="20" y="243" font-size="16" >労働党</text><text x="333" y="243" font-size="16" text-anchor="end">36議席</text><rect x="20" y="251" width="136.5" height="18" fill="#396e61"/><rect x="156.5" y="251" width="97.5" height="18" fill="#c6a166"/><text x="20" y="287" font-size="14" >選挙区 21 ＋ 名簿 15</text><text x="20" y="321" font-size="16" >緑の党</text><text x="333" y="321" font-size="16" text-anchor="end">16議席</text><rect x="20" y="329" width="13.0" height="18" fill="#396e61"/><rect x="33.0" y="329" width="91.0" height="18" fill="#c6a166"/><text x="20" y="365" font-size="14" >選挙区 2 ＋ 名簿 14</text><text x="20" y="399" font-size="16" >ACT</text><text x="333" y="399" font-size="16" text-anchor="end">13議席</text><rect x="20" y="407" width="6.5" height="18" fill="#396e61"/><rect x="26.5" y="407" width="78.0" height="18" fill="#c6a166"/><text x="20" y="443" font-size="14" >選挙区 1 ＋ 名簿 12</text><text x="20" y="477" font-size="16" >NZ第一党</text><text x="333" y="477" font-size="16" text-anchor="end">12議席</text><rect x="20.0" y="485" width="78.0" height="18" fill="#c6a166"/><text x="20" y="521" font-size="14" >選挙区 0 ＋ 名簿 12</text><text x="20" y="555" font-size="16" >オポチュニティー党</text><text x="333" y="555" font-size="16" text-anchor="end">7議席</text><rect x="20.0" y="563" width="45.5" height="18" fill="#c6a166"/><text x="20" y="599" font-size="14" >選挙区 0 ＋ 名簿 7</text><text x="20" y="633" font-size="16" >マオリ党</text><text x="333" y="633" font-size="16" text-anchor="end">5議席</text><rect x="20" y="641" width="32.5" height="18" fill="#396e61"/><text x="20" y="677" font-size="14" >選挙区 5 ＋ 名簿 0</text><text x="20" y="737" font-size="18" font-weight="700">現与党側 42＋13＋12＝67</text><text x="20" y="767" font-size="17" >その他 64 ／ 総数131・過半数66</text><text x="20" y="798" font-size="16" >特別票・正式集計で変わり得る。</text><text x="20" y="824" font-size="16" >棒は同一尺度。国民党は選挙区のみ。</text><text x="20" y="852" font-size="14" >NZ選管の暫定結果より編集部作図</text></g></svg>

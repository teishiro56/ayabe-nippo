<svg xmlns="http://www.w3.org/2000/svg" width="700" height="780" viewBox="0 0 700 780" role="img"><title>火星と木星の見かけの間隔</title><desc>11月16日の離角は約1.2度。満月の見かけの直径約0.5度の2.4倍。実距離を表す図ではない。</desc><rect width="700" height="780" fill="#142e43"/><g font-family="sans-serif" fill="#f4f0df"><text x="35" y="55" font-size="34" font-weight="bold">空で近く見える、約1.2度</text><text x="35" y="100" font-size="28">11月16日／火星と木星の最接近</text><circle cx="140" cy="260" r="14" fill="#d57d55"/><circle cx="560" cy="260" r="22" fill="#f5d88a"/><text x="140" y="205" font-size="32" text-anchor="middle">火星</text><text x="560" y="205" font-size="32" text-anchor="middle">木星</text><path d="M140 305V335H560V305" stroke="#f4f0df" stroke-width="3" fill="none"/><text x="350" y="383" font-size="34" text-anchor="middle">見かけの間隔 約1.2度</text><circle cx="140" cy="495" r="87.5" fill="#c1cccf"/><path d="M52.5 495H227.5" stroke="#142e43" stroke-width="3"/><text x="285" y="465" font-size="30">比較：満月の直径</text><text x="285" y="510" font-size="34">約0.5度</text><text x="285" y="557" font-size="28">間隔は直径の約2.4倍</text><text x="35" y="640" font-size="28">星の円は記号。天体の大きさではない。</text><text x="35" y="682" font-size="28">図の方向は便宜上。実際の星図ではない。</text><text x="35" y="724" font-size="28">実距離ではなく、地球から見た角度の比較。</text><text x="35" y="766" font-size="28">出典：国立天文台「火星と木星が接近」</text></g></svg>
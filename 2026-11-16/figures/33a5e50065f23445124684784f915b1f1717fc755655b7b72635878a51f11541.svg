<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" aria-labelledby="t d"><title id="t">AlphaGenome 2の原因変異検出割合</title><desc id="d">一次免疫細胞を対象とした開発側の比較。比較対象16パーセント、新モデル30パーセント。診断精度ではない。</desc><rect width="680" height="490" fill="#f2f6f4"/><g font-family="sans-serif" fill="#183c45"><text x="35" y="48" font-size="30" font-weight="bold">細胞別に、原因変異を探す</text><text x="35" y="88" font-size="28">一次免疫細胞での検出割合</text><g stroke="#bdcecd"><path d="M210 140V310M340 140V310M470 140V310M600 140V310"/></g><text x="35" y="186" font-size="28">比較対象</text><text x="35" y="271" font-size="28">新モデル</text><rect x="210" y="151" width="208" height="48" fill="#91aaa9"/><rect x="210" y="236" width="390" height="48" fill="#177e87"/><text x="430" y="184" font-size="30" font-weight="bold">16%</text><text x="510" y="269" fill="white" font-size="30" font-weight="bold">30%</text><g font-size="28" text-anchor="middle"><text x="210" y="341">0</text><text x="340" y="341">10</text><text x="470" y="341">20</text><text x="600" y="341">30%</text></g><text x="35" y="395" font-size="28" font-weight="bold">診断精度ではありません</text><text x="35" y="435" font-size="28">開発側の評価。研究用の予測モデル。</text><text x="35" y="474" font-size="28">出典：DeepMind公式発表（11月11日）</text></g></svg>

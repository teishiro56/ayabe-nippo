<svg xmlns="http://www.w3.org/2000/svg" width="360" height="960" viewBox="0 0 360 960" role="img"><rect width="360" height="960" fill="#f3f6fa"/><g font-family="Noto Sans CJK JP,sans-serif" fill="#13253c"><text x="20" y="34" font-size="20" font-weight="700">マグロ枠は「2年」で考える</text><text x="20" y="62" font-size="14" font-weight="400">日本・2027〜28年の北小委員会合意案</text><text x="20" y="92" font-size="17" font-weight="700">大型は増加、小型は減少</text><text x="20" y="116" font-size="14" font-weight="400">1年当たりの基準（トン）</text><path d="M46.0,147 L46.0,394" fill="none" stroke="#d3dce4" stroke-width="1"/><text x="38.0" y="140" font-size="14" font-weight="400">0千</text><path d="M136.0,147 L136.0,394" fill="none" stroke="#d3dce4" stroke-width="1"/><text x="128.0" y="140" font-size="14" font-weight="400">4千</text><path d="M226.0,147 L226.0,394" fill="none" stroke="#d3dce4" stroke-width="1"/><text x="218.0" y="140" font-size="14" font-weight="400">8千</text><path d="M316.0,147 L316.0,394" fill="none" stroke="#d3dce4" stroke-width="1"/><text x="308.0" y="140" font-size="14" font-weight="400">12千</text><text x="20" y="153" font-size="14" font-weight="400">大型30kg以上・従来</text><rect x="46" y="162" width="189.4725" height="23" rx="4" fill="#a9b8c6"/><text x="52" y="179" font-size="14" font-weight="700">8,421</text><text x="20" y="219" font-size="14" font-weight="400">大型・合意案</text><rect x="46" y="228" width="236.835" height="23" rx="4" fill="#72abb8"/><text x="52" y="245" font-size="14" font-weight="700">10,526</text><text x="20" y="291" font-size="14" font-weight="400">小型30kg未満・従来</text><rect x="46" y="300" width="99.1575" height="23" rx="4" fill="#a9b8c6"/><text x="52" y="317" font-size="14" font-weight="700">4,407</text><text x="20" y="357" font-size="14" font-weight="400">小型・合意案</text><rect x="46" y="366" width="93.3075" height="23" rx="4" fill="#d6a084"/><text x="52" y="383" font-size="14" font-weight="700">4,147</text><text x="20" y="433" font-size="17" font-weight="700">2年合計の上限</text><text x="20" y="459" font-size="17" font-weight="400">大型 21,052 t ／ 小型 8,294 t</text><text x="20" y="497" font-size="17" font-weight="700">年の基準を超えて取れるが…</text><text x="20" y="524" font-size="14" font-weight="400">以下は年基準を100とした計算例</text><text x="20" y="549" font-size="15" font-weight="400">均等に取る例</text><rect x="20" y="563" width="160.0" height="36" rx="4" fill="#72abb8"/><rect x="180.0" y="563" width="160.0" height="36" rx="4" fill="#91b9c2"/><text x="28" y="587" font-size="15" font-weight="700">2027年 100</text><text x="188.0" y="587" font-size="15" font-weight="700">28年 100</text><text x="20" y="635" font-size="15" font-weight="400">初年に多く取る例</text><rect x="20" y="649" width="200.0" height="36" rx="4" fill="#72abb8"/><rect x="220.0" y="649" width="120.0" height="36" rx="4" fill="#91b9c2"/><text x="28" y="673" font-size="15" font-weight="700">2027年 125</text><text x="228.0" y="673" font-size="15" font-weight="700">28年 75</text><text x="20" y="716" font-size="15" font-weight="700">各年は最大125、2年では最大200。</text><text x="20" y="742" font-size="14" font-weight="400">両年とも125ずつ取れるわけではない。</text><path d="M20,772 L340,772" fill="none" stroke="#c4ced8" stroke-width="1"/><text x="20" y="803" font-size="14" font-weight="400">11月30日〜12月5日の年次会合で議論。</text><text x="20" y="829" font-size="14" font-weight="400">まだ正式決定でも水揚げ実績でもない。</text><text x="20" y="862" font-size="14" font-weight="400">棒の長さは同じ尺度・ゼロ起点。</text><text x="20" y="887" font-size="14" font-weight="400">下段は制度の計算例で、漁獲予測ではない。</text><text x="20" y="923" font-size="13" font-weight="400">出典：水産庁 北小委員会結果（11月20日）</text><text x="20" y="947" font-size="13" font-weight="400">作図：アヤベ日報</text></g></svg>
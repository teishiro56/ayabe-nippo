<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900" role="img"><rect width="360" height="900" fill="#f3f6fa"/><g font-family="Noto Sans CJK JP,sans-serif" fill="#13253c"><text x="20" y="34" font-size="21" font-weight="700">「欠ける」と生まれる機能</text><text x="20" y="62" font-size="16" font-weight="400">分子の抜け跡が、水を抱える孔に</text><text x="20" y="100" font-size="16" font-weight="700">分子どうしの小さな隙間とは違う</text><circle cx="60" cy="145" r="28" fill="#437780" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="53" cy="137" r="7" fill="#6da0a7" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="140" cy="145" r="28" fill="#437780" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="133" cy="137" r="7" fill="#6da0a7" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="220" cy="145" r="28" fill="#437780" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="213" cy="137" r="7" fill="#6da0a7" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="300" cy="145" r="28" fill="#437780" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="293" cy="137" r="7" fill="#6da0a7" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="60" cy="217" r="28" fill="#437780" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="53" cy="209" r="7" fill="#6da0a7" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="140" cy="217" r="29" fill="white" stroke="#ac5730" stroke-width="2" stroke-dasharray="5 4"/><circle cx="220" cy="217" r="28" fill="#437780" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="213" cy="209" r="7" fill="#6da0a7" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="300" cy="217" r="28" fill="#437780" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="293" cy="209" r="7" fill="#6da0a7" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="60" cy="289" r="28" fill="#437780" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="53" cy="281" r="7" fill="#6da0a7" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="140" cy="289" r="28" fill="#437780" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="133" cy="281" r="7" fill="#6da0a7" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="220" cy="289" r="28" fill="#437780" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="213" cy="281" r="7" fill="#6da0a7" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="300" cy="289" r="28" fill="#437780" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="293" cy="281" r="7" fill="#6da0a7" stroke="none" stroke-width="2" stroke-dasharray=""/><path d="M124,235 L86,326" fill="none" stroke="#ac5730" stroke-width="2"/><text x="40" y="352" font-size="16" font-weight="700">破線：分子がない位置</text><text x="40" y="378" font-size="16" font-weight="400">孔の大きさは約1 nm</text><text x="40" y="402" font-size="14" font-weight="400">1 nm ＝ 10億分の1メートル</text><text x="20" y="447" font-size="18" font-weight="700">孔に水が取り込まれる</text><circle cx="180" cy="540" r="63" fill="white" stroke="#ac5730" stroke-width="2" stroke-dasharray="5 4"/><circle cx="155" cy="520" r="9" fill="#579bc0" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="146" cy="512" r="4" fill="#badbe9" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="165" cy="513" r="4" fill="#badbe9" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="196" cy="515" r="9" fill="#579bc0" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="187" cy="507" r="4" fill="#badbe9" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="206" cy="508" r="4" fill="#badbe9" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="173" cy="554" r="9" fill="#579bc0" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="164" cy="546" r="4" fill="#badbe9" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="183" cy="547" r="4" fill="#badbe9" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="210" cy="555" r="9" fill="#579bc0" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="201" cy="547" r="4" fill="#badbe9" stroke="none" stroke-width="2" stroke-dasharray=""/><circle cx="220" cy="548" r="4" fill="#badbe9" stroke="none" stroke-width="2" stroke-dasharray=""/><text x="26" y="635" font-size="15" font-weight="700">水を介し、水素イオンが動きやすく</text><text x="26" y="663" font-size="15" font-weight="400">低湿度でも水を保持する孔が、</text><text x="26" y="687" font-size="15" font-weight="400">イオンを運ぶ機能を支える。</text><path d="M20,720 L340,720" fill="none" stroke="#c4ced8" stroke-width="1"/><text x="20" y="750" font-size="15" font-weight="700">説明用模式図・縮尺なし</text><text x="20" y="776" font-size="14" font-weight="400">分子や水の個数・配置は説明用。</text><text x="20" y="800" font-size="14" font-weight="400">原子構造・欠損率の測定図ではない。</text><text x="20" y="824" font-size="14" font-weight="400">実際の欠損には集まり方の偏りがある。</text><text x="20" y="858" font-size="13" font-weight="400">出典：広島大学・Small論文（11月20日）</text><text x="20" y="882" font-size="13" font-weight="400">作図：アヤベ日報</text></g></svg>
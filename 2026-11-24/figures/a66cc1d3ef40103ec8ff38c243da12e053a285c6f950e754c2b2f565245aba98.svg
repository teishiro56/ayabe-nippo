<svg xmlns="http://www.w3.org/2000/svg" width="360" height="666" viewBox="0 0 360 666" role="img"><title>ミラA、輝点とガスの輪をつなぐ観測</title><desc>2023年の表面の輝点と2025年に観測した遠方の輪。線で表すのは研究者の推定で、実測の移動経路ではない。</desc><rect width="360" height="666" fill="#f3f6fa"/><g font-family="Noto Sans CJK JP,sans-serif" fill="#162638"><text x="20" y="35" font-size="21" font-weight="700" fill="#162638">ミラAのガスの輪はどこから？</text><text x="20" y="63" font-size="15" font-weight="400" fill="#355369">2つの時点の観測を比較／非縮尺</text><rect x="18" y="90" width="324" height="115" rx="3" fill="#e7eff6"/><text x="31" y="119" font-size="17" font-weight="700" fill="#162638">2023年6月の観測</text><circle cx="85" cy="160" r="26" fill="#b66442"/><circle cx="67" cy="177" r="6" fill="#f5ce76"/><text x="134" y="152" font-size="15" font-weight="400" fill="#162638">表面の南西で輝点</text><text x="134" y="178" font-size="15" font-weight="400" fill="#162638">局所的に電波が強い</text><path d="M180,207 V242" fill="none" stroke="#476886" stroke-width="2" stroke-dasharray="5 5"/><path d="M174,236 L180,243 L186,236" fill="none" stroke="#476886" stroke-width="2"/><text x="20" y="265" font-size="15" font-weight="700" fill="#162638">時期と位置が整合。同じ噴出と推定。</text><rect x="18" y="285" width="324" height="139" rx="3" fill="#e7eff6"/><text x="31" y="314" font-size="17" font-weight="700" fill="#162638">2025年8月の観測</text><circle cx="94" cy="350" r="20" fill="#b66442"/><path d="M88,369 Q67,398 56,395 Q40,388 53,369 Q67,360 77,354" fill="none" stroke="#43859a" stroke-width="3"/><text x="135" y="352" font-size="15" font-weight="400" fill="#162638">外側にガスの輪</text><text x="135" y="370" font-size="15" font-weight="400" fill="#162638">表面から最大約10 AU</text><text x="135" y="397" font-size="15" font-weight="400" fill="#162638">太陽から土星までに近い</text><path d="M20,451 H340" fill="none" stroke="#bdcddd" stroke-width="1"/><text x="20" y="479" font-size="17" font-weight="700" fill="#162638">磁場の手掛かり</text><path d="M28,514 q18,-25 38,0 t38,0" fill="none" stroke="#43859a" stroke-width="3"/><text x="127" y="507" font-size="15" font-weight="400" fill="#162638">ガスの電波の偏りを測定</text><text x="127" y="531" font-size="15" font-weight="400" fill="#162638">輪に強い磁場と判断</text><text x="20" y="568" font-size="15" font-weight="400" fill="#162638">点線は推定。飛び出す瞬間は未観測。</text><text x="20" y="598" font-size="15" font-weight="400" fill="#162638">AU：地球と太陽の平均距離</text><text x="20" y="633" font-size="15" font-weight="400" fill="#355369">出典：ESO・論文　作図：アヤベ日報</text></g></svg>
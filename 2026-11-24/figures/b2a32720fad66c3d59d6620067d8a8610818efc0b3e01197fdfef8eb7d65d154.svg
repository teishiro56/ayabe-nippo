<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600" viewBox="0 0 360 600" role="img"><title>iDeCo月額上限の改正前後</title><desc>3区分を同じ0から8万円の尺度で比較。企業年金のある会社員などは別途差し引き。</desc><rect width="360" height="600" fill="#f3f6fa"/><g font-family="Noto Sans CJK JP,sans-serif" fill="#162638"><text x="20" y="35" font-size="20" font-weight="700" fill="#162638">iDeCoの月額上限、誰が変わる？</text><text x="20" y="64" font-size="15" font-weight="400" fill="#355369">2026年12月分から／単位：万円</text><path d="M80,107 V424" fill="none" stroke="#bdcddd" stroke-width="1"/><text x="76" y="100" font-size="15" font-weight="400" fill="#162638">0</text><path d="M138,107 V424" fill="none" stroke="#bdcddd" stroke-width="1"/><text x="134" y="100" font-size="15" font-weight="400" fill="#162638">2</text><path d="M196,107 V424" fill="none" stroke="#bdcddd" stroke-width="1"/><text x="192" y="100" font-size="15" font-weight="400" fill="#162638">4</text><path d="M254,107 V424" fill="none" stroke="#bdcddd" stroke-width="1"/><text x="250" y="100" font-size="15" font-weight="400" fill="#162638">6</text><path d="M312,107 V424" fill="none" stroke="#bdcddd" stroke-width="1"/><text x="308" y="100" font-size="15" font-weight="400" fill="#162638">8</text><text x="20" y="146" font-size="16" font-weight="700" fill="#162638">自営業者など（国民年金基金と合算）</text><text x="20" y="179" font-size="15" font-weight="400" fill="#162638">従来</text><rect x="80" y="166" width="197.2" height="16" rx="3" fill="#a9bfd0"/><text x="284.2" y="180" font-size="15" font-weight="700" fill="#162638">6.8</text><text x="20" y="208" font-size="15" font-weight="400" fill="#162638">改正後</text><rect x="80" y="195" width="217.5" height="16" rx="3" fill="#43859a"/><text x="304.5" y="209" font-size="15" font-weight="700" fill="#162638">7.5</text><text x="20" y="248" font-size="16" font-weight="700" fill="#162638">企業年金のない会社員など</text><text x="20" y="281" font-size="15" font-weight="400" fill="#162638">従来</text><rect x="80" y="268" width="66.69999999999999" height="16" rx="3" fill="#a9bfd0"/><text x="153.7" y="282" font-size="15" font-weight="700" fill="#162638">2.3</text><text x="20" y="310" font-size="15" font-weight="400" fill="#162638">改正後</text><rect x="80" y="297" width="179.8" height="16" rx="3" fill="#43859a"/><text x="266.8" y="311" font-size="15" font-weight="700" fill="#162638">6.2</text><text x="20" y="349" font-size="16" font-weight="700" fill="#162638">扶養される配偶者（第3号）</text><text x="20" y="382" font-size="15" font-weight="400" fill="#162638">従来</text><rect x="80" y="369" width="66.69999999999999" height="16" rx="3" fill="#a9bfd0"/><text x="153.7" y="383" font-size="15" font-weight="700" fill="#162638">2.3</text><text x="20" y="411" font-size="15" font-weight="400" fill="#162638">改正後</text><rect x="80" y="398" width="66.69999999999999" height="16" rx="3" fill="#43859a"/><text x="153.7" y="412" font-size="15" font-weight="700" fill="#162638">2.3</text><path d="M20,446 H340" fill="none" stroke="#bdcddd" stroke-width="1"/><text x="20" y="474" font-size="16" font-weight="700" fill="#162638">企業年金がある場合</text><text x="20" y="499" font-size="15" font-weight="400" fill="#162638">6.2万円から会社の掛金相当額など</text><text x="20" y="523" font-size="15" font-weight="400" fill="#162638">を差し引く。従来は別の上限あり。</text><text x="20" y="566" font-size="15" font-weight="400" fill="#355369">出典：厚生労働省　作図：アヤベ日報</text></g></svg>
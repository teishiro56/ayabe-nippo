<svg xmlns="http://www.w3.org/2000/svg" width="390" height="334" viewBox="0 0 390 334" role="img" aria-labelledby="t d"><title id="t">新しい4特別区の組み合わせ</title><desc id="d">現行24区を淀川4区、北6区、中央7区、天王寺7区に分ける案。</desc><rect width="390" height="334" rx="12" fill="#edf4f7"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#132b3a"><text x="20" y="34" font-size="20" font-weight="700" fill="#132b3a">いまの24行政区をどう束ねるか</text><text x="20" y="61" font-size="17" font-weight="500" fill="#132b3a">特別区設置協定書案｜11月26日</text><rect x="17" y="78" width="354" height="46" rx="6" fill="#dbe9ed"/><text x="27" y="97" font-size="17" font-weight="700" fill="#132b3a">淀川区　現在の4区から</text><text x="27" y="116" font-size="16" font-weight="500" fill="#132b3a">此花・西淀川・淀川・東淀川</text><rect x="17" y="130" width="354" height="46" rx="6" fill="#dbe9ed"/><text x="27" y="149" font-size="17" font-weight="700" fill="#132b3a">北区　現在の6区から</text><text x="27" y="168" font-size="16" font-weight="500" fill="#132b3a">北・都島・福島・旭・城東・鶴見</text><rect x="17" y="182" width="354" height="46" rx="6" fill="#dbe9ed"/><text x="27" y="201" font-size="17" font-weight="700" fill="#132b3a">中央区　現在の7区から</text><text x="27" y="220" font-size="16" font-weight="500" fill="#132b3a">中央・西・港・大正など</text><rect x="17" y="234" width="354" height="46" rx="6" fill="#dbe9ed"/><text x="27" y="253" font-size="17" font-weight="700" fill="#132b3a">天王寺区　現在の7区から</text><text x="27" y="272" font-size="16" font-weight="500" fill="#132b3a">天王寺・東成・阿倍野など</text><text x="20" y="317" font-size="16" font-weight="500" fill="#132b3a">数は現行の行政区。人口や面積ではない。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="313" viewBox="0 0 390 313" role="img" aria-labelledby="t d"><title id="t">バレー日鉄堺対東京のセット別得点</title><desc id="d">堺から見て25対23、25対21、20対25、22対25、13対15。先に堺が2セット取り、東京が残り3セットを取った。</desc><rect width="390" height="313" rx="12" fill="#edf4f7"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#132b3a"><text x="20" y="34" font-size="20" font-weight="700" fill="#132b3a">第1・2セットは堺、後半は東京</text><text x="20" y="62" font-size="17" font-weight="500" fill="#132b3a">11月26日｜和歌山｜点数は堺—東京</text><rect x="17" y="81" width="354" height="31" rx="6" fill="#dbe9ed"/><text x="27" y="103" font-size="17" font-weight="500" fill="#132b3a">第1セット</text><text x="163" y="103" font-size="18" font-weight="700" fill="#132b3a">25 — 23</text><text x="279" y="103" font-size="16" font-weight="700" fill="#244b67">堺が取得</text><rect x="17" y="118" width="354" height="31" rx="6" fill="#edf4f7"/><text x="27" y="140" font-size="17" font-weight="500" fill="#132b3a">第2セット</text><text x="163" y="140" font-size="18" font-weight="700" fill="#132b3a">25 — 21</text><text x="279" y="140" font-size="16" font-weight="700" fill="#244b67">堺が取得</text><rect x="17" y="155" width="354" height="31" rx="6" fill="#dbe9ed"/><text x="27" y="177" font-size="17" font-weight="500" fill="#132b3a">第3セット</text><text x="163" y="177" font-size="18" font-weight="700" fill="#132b3a">20 — 25</text><text x="279" y="177" font-size="16" font-weight="700" fill="#8b471d">東京が取得</text><rect x="17" y="192" width="354" height="31" rx="6" fill="#edf4f7"/><text x="27" y="214" font-size="17" font-weight="500" fill="#132b3a">第4セット</text><text x="163" y="214" font-size="18" font-weight="700" fill="#132b3a">22 — 25</text><text x="279" y="214" font-size="16" font-weight="700" fill="#8b471d">東京が取得</text><rect x="17" y="229" width="354" height="31" rx="6" fill="#dbe9ed"/><text x="27" y="251" font-size="17" font-weight="500" fill="#132b3a">第5セット</text><text x="163" y="251" font-size="18" font-weight="700" fill="#132b3a">13 — 15</text><text x="279" y="251" font-size="16" font-weight="700" fill="#8b471d">東京が取得</text><text x="20" y="297" font-size="16" font-weight="500" fill="#132b3a">最終セットは15点制。東京が3–2で勝利。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="294" viewBox="0 0 390 294" role="img" aria-labelledby="t d"><title id="t">広島県内の養殖カキ被害の幅</title><desc id="d">2026年11月20日農水相会見。2年養殖は10〜90％、3年養殖は50〜90％。平均値や海域別の値ではない。</desc><rect width="390" height="294" rx="12" fill="#edf4f7"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#132b3a"><text x="20" y="34" font-size="21" font-weight="700" fill="#132b3a">養殖年数で違う、カキの被害幅</text><text x="20" y="62" font-size="17" font-weight="500" fill="#132b3a">2026年11月20日、広島県内の報告</text><path d="M32.0 88v137" stroke="#abbcc6"/><text x="32.0" y="246" font-size="16" font-weight="500" fill="#132b3a">0</text><path d="M113.25 88v137" stroke="#abbcc6"/><text x="99.25" y="246" font-size="16" font-weight="500" fill="#132b3a">25</text><path d="M194.5 88v137" stroke="#abbcc6"/><text x="180.5" y="246" font-size="16" font-weight="500" fill="#132b3a">50</text><path d="M275.75 88v137" stroke="#abbcc6"/><text x="261.75" y="246" font-size="16" font-weight="500" fill="#132b3a">75</text><path d="M357.0 88v137" stroke="#abbcc6"/><text x="343.0" y="246" font-size="16" font-weight="500" fill="#132b3a">100</text><text x="21" y="99" font-size="18" font-weight="700" fill="#132b3a">2年養殖</text><path d="M64.5 121H324.5" stroke="#2e5d78" stroke-width="15" stroke-linecap="butt"/><text x="224" y="147" font-size="17" font-weight="700" fill="#2e5d78">10〜90％</text><text x="21" y="167" font-size="18" font-weight="700" fill="#132b3a">3年養殖</text><path d="M194.5 189H324.5" stroke="#975319" stroke-width="15" stroke-linecap="butt"/><text x="224" y="215" font-size="17" font-weight="700" fill="#975319">50〜90％</text><text x="21" y="276" font-size="17" font-weight="500" fill="#132b3a">横軸：死んだ割合（％）。平均ではない。</text></g></svg>
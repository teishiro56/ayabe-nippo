<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312"><rect width="360" height="312" rx="12" fill="#ecf2f6"/><g font-family="Noto Sans CJK JP,sans-serif" font-size="17" fill="#172b43"><text x="15" y="31" font-size="19" font-weight="bold">官邸が使えないとき</text><text x="15" y="59" font-size="17">緊急災害対策本部の移転先</text><rect x="16" y="74" width="328" height="36" rx="6" fill="#fff"/><text x="28" y="98" font-size="17" font-weight="bold">1</text><text x="54" y="98" font-size="17">防災庁（合同庁舎第8号館）</text><rect x="16" y="117" width="328" height="36" rx="6" fill="#fff"/><text x="28" y="141" font-size="17" font-weight="bold">2</text><text x="54" y="141" font-size="17">防衛省（市ヶ谷地区）</text><rect x="16" y="160" width="328" height="36" rx="6" fill="#fff"/><text x="28" y="184" font-size="17" font-weight="bold">3</text><text x="54" y="184" font-size="17">立川広域防災基地の予備施設</text><text x="16" y="221" font-size="15">被災状況を見て、この順で検討</text><path d="M16 236h328" stroke="#8ba5b5"/><text x="16" y="260" font-size="17" font-weight="bold">本部移転とは別の備え</text><text x="16" y="288" font-size="16">地方の出先機関が業務代行・遠隔応援</text></g></svg>

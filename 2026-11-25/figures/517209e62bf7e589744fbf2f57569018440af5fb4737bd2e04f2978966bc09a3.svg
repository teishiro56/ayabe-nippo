<svg xmlns="http://www.w3.org/2000/svg" width="390" height="234" viewBox="0 0 390 234" role="img" aria-labelledby="t d"><title id="t">2025年の確認死傷者、計6,929人</title><desc id="d">ミャンマー1,891人、シリア1,602人、その他3,436人。</desc><rect width="390" height="234" rx="14" fill="#edf4f7"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#192f43"><text x="17" y="30" font-size="19" font-weight="bold" text-anchor="start" fill="#192f43">地雷・不発弾の確認死傷者</text><text x="17" y="56" font-size="16" font-weight="normal" text-anchor="start" fill="#192f43">2025年・世界 計6,929人</text><rect x="17.0000" y="77" width="97.1563" height="44" fill="#164e67"/><text x="65.57814980516669" y="105" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">27%</text><rect x="114.1563" y="77" width="82.3080" height="44" fill="#2c6870"/><text x="155.31029008514938" y="105" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">23%</text><rect x="196.4643" y="77" width="176.5357" height="44" fill="#bccbd6"/><text x="284.7321402799827" y="105" font-size="16" font-weight="bold" text-anchor="middle" fill="#152e42">50%</text><rect x="18" y="143" width="12" height="12" rx="2" fill="#164e67"/><text x="40" y="154" font-size="16" font-weight="normal" text-anchor="start" fill="#192f43">ミャンマー</text><text x="366" y="154" font-size="16" font-weight="bold" text-anchor="end" fill="#192f43">1,891人</text><rect x="18" y="169" width="12" height="12" rx="2" fill="#2c6870"/><text x="40" y="180" font-size="16" font-weight="normal" text-anchor="start" fill="#192f43">シリア</text><text x="366" y="180" font-size="16" font-weight="bold" text-anchor="end" fill="#192f43">1,602人</text><rect x="18" y="195" width="12" height="12" rx="2" fill="#bccbd6"/><text x="40" y="206" font-size="16" font-weight="normal" text-anchor="start" fill="#192f43">その他の集計分</text><text x="366" y="206" font-size="16" font-weight="bold" text-anchor="end" fill="#192f43">3,436人</text></g></svg>
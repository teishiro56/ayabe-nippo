<svg xmlns="http://www.w3.org/2000/svg" width="390" height="292" viewBox="0 0 390 292" role="img" aria-labelledby="t d"><title id="t">大阪のNOLL従来型、改定前後の比較</title><desc id="d">10分99円へ下がり、20分198円、30分297円へ上がる。</desc><rect width="390" height="292" rx="14" fill="#edf4f7"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#192f43"><text x="16" y="30" font-size="19" font-weight="bold" text-anchor="start" fill="#192f43">大阪：従来型の1回利用</text><text x="16" y="56" font-size="16" font-weight="normal" text-anchor="start" fill="#192f43">12月1日に時間区切りが変わる</text><text x="17" y="110" font-size="16" font-weight="bold" text-anchor="start" fill="#192f43">10分</text><rect x="90" y="86" width="113.85" height="15" rx="3" fill="#5e778a"/><text x="211.85" y="99" font-size="16" font-weight="normal" text-anchor="start" fill="#192f43">165円</text><rect x="90" y="108" width="68.31" height="15" rx="3" fill="#145c69"/><text x="166.31" y="121" font-size="16" font-weight="normal" text-anchor="start" fill="#192f43">99円</text><text x="17" y="170" font-size="16" font-weight="bold" text-anchor="start" fill="#192f43">20分</text><rect x="90" y="146" width="113.85" height="15" rx="3" fill="#5e778a"/><text x="211.85" y="159" font-size="16" font-weight="normal" text-anchor="start" fill="#192f43">165円</text><rect x="90" y="168" width="136.62" height="15" rx="3" fill="#145c69"/><text x="234.61999999999998" y="181" font-size="16" font-weight="normal" text-anchor="start" fill="#192f43">198円</text><text x="17" y="230" font-size="16" font-weight="bold" text-anchor="start" fill="#192f43">30分</text><rect x="90" y="206" width="113.85" height="15" rx="3" fill="#5e778a"/><text x="211.85" y="219" font-size="16" font-weight="normal" text-anchor="start" fill="#192f43">165円</text><rect x="90" y="228" width="204.93" height="15" rx="3" fill="#145c69"/><text x="302.92999999999995" y="241" font-size="16" font-weight="normal" text-anchor="start" fill="#192f43">297円</text><rect x="17" y="260" width="13" height="13" fill="#5e778a"/><text
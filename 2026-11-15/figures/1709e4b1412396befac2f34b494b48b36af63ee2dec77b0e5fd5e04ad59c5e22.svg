<svg xmlns="http://www.w3.org/2000/svg" width="350" height="510" viewBox="0 0 350 510" role="img" aria-labelledby="title desc">
<title id="title">沖縄知事選動画の上位50アカウントを過去の発信地域で分ける</title>
<desc id="desc">沖縄のみ32アカウント190本、沖縄と兵庫6アカウント27本、沖縄と宮城7アカウント42本、3県全て5アカウント71本。全体は50アカウント330本。</desc>
<rect width="350" height="510" rx="10" fill="#eee9dd"/>
<g font-family="Noto Sans CJK JP,sans-serif" fill="#203746">
<text x="18" y="30" font-size="17" font-weight="bold">同じ発信者が、別の県の選挙へ</text>
<text x="18" y="57" font-size="14">沖縄の再生上位50アカウントが母集団</text>
<text x="18" y="81" font-size="14">過去の兵庫・宮城での発信を照合</text>
<rect x="15" y="101" width="320" height="295" rx="8" fill="#fffdf7" stroke="#607a80"/>
<text x="30" y="126" font-size="15" font-weight="bold">全員が沖縄で発信</text>
<ellipse cx="123" cy="232" rx="95" ry="99" fill="#bfd8e1" fill-opacity=".6" stroke="#366a80" stroke-width="2"/>
<ellipse cx="229" cy="232" rx="95" ry="99" fill="#e7c0a0" fill-opacity=".55" stroke="#996237" stroke-width="2"/>
<text x="50" y="177" font-size="15" font-weight="bold">兵庫でも</text>
<text x="230" y="177" font-size="15" font-weight="bold">宮城でも</text>
<text x="56" y="231" font-size="16">6アカウント</text>
<text x="69" y="257" font-size="14">27本</text>
<text x="219" y="231" font-size="16">7アカウント</text>
<text x="240" y="257" font-size="14">42本</text>
<text x="151" y="212" font-size="14">3県全て</text>
<text x="166" y="243" font-size="19" font-weight="bold">5</text>
<text x="156" y="270" font-size="14">71本</text>
<text x="32" y="375" font-size="15" font-weight="bold">沖縄のみ：32アカウント・190本</text>
<text x="18" y="410" font-size="14">兵庫でも発信した計11アカウントは</text>
<text x="18" y="434" font-size="14">98本で、推計収益の約6割を占めた。</text>
<text x="18" y="465" font-size="14">円の面積は人数・収益の比率ではない。</text>
<text x="18" y="490" font-size="14">出典：神戸新聞 11/14／編集部作図</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="360" height="694" viewBox="0 0 360 694" role="img"><rect width="360" height="694" fill="#f3f6fa"/><g font-family="Noto Sans CJK JP,sans-serif" fill="#13253c"><text x="18" y="35" font-size="20" font-weight="700">御堂筋、昼と夜で変わる通り方</text><text x="18" y="66" font-size="15" font-weight="400">11月23日・淀屋橋から船場中央3</text><text x="18" y="89" font-size="15" font-weight="400">予定時刻／日本時間</text><path d="M54.35483870967742,148 L54.35483870967742,432" fill="none" stroke="#cbd7e0" stroke-width="1"/><text x="40.35483870967742" y="142" font-size="15" font-weight="400">12時</text><path d="M93.06451612903226,148 L93.06451612903226,432" fill="none" stroke="#cbd7e0" stroke-width="1"/><text x="79.06451612903226" y="142" font-size="15" font-weight="400">13時</text><path d="M131.7741935483871,148 L131.7741935483871,432" fill="none" stroke="#cbd7e0" stroke-width="1"/><text x="117.7741935483871" y="142" font-size="15" font-weight="400">14時</text><path d="M170.48387096774192,148 L170.48387096774192,432" fill="none" stroke="#cbd7e0" stroke-width="1"/><text x="156.48387096774192" y="142" font-size="15" font-weight="400">15時</text><path d="M209.19354838709677,148 L209.19354838709677,432" fill="none" stroke="#cbd7e0" stroke-width="1"/><text x="195.19354838709677" y="142" font-size="15" font-weight="400">16時</text><path d="M247.90322580645162,148 L247.90322580645162,432" fill="none" stroke="#cbd7e0" stroke-width="1"/><text x="233.90322580645162" y="142" font-size="15" font-weight="400">17時</text><path d="M286.61290322580646,148 L286.61290322580646,432" fill="none" stroke="#cbd7e0" stroke-width="1"/><text x="272.61290322580646" y="142" font-size="15" font-weight="400">18時</text><path d="M325.3225806451613,148 L325.3225806451613,432" fill="none" stroke="#cbd7e0" stroke-width="1"/><text x="311.3225806451613" y="142" font-size="15" font-weight="400">19時</text><text x="18" y="169" font-size="15" font-weight="700">車両規制</text><text x="169" y="169" font-size="15" font-weight="400">11:30頃〜19:15頃</text><rect x="35.0" y="186" width="300.0" height="20" rx="4" fill="#b5654b"/><text x="18" y="241" font-size="15" font-weight="700">ランウェイ</text><text x="169" y="241" font-size="15" font-weight="400">14:00〜16:00</text><rect x="131.7741935483871" y="258" width="77.41935483870967" height="20" rx="4" fill="#689bb9"/><text x="18" y="313" font-size="15" font-weight="700">点灯式</text><text x="169" y="313" font-size="15" font-weight="400">17:00〜17:30</text><rect x="247.90322580645162" y="330" width="19.35483870967741" height="20" rx="4" fill="#73599c"/><text x="18" y="385" font-size="15" font-weight="700">歩行者開放</text><text x="169" y="385" font-size="15" font-weight="400">式終了後〜19:00</text><rect x="267.258064516129" y="402" width="58.064516129032256" height="20" rx="4" fill="#4c8c76"/><text x="18" y="467" font-size="15" font-weight="700">ランウェイ中は歩道の観覧席で</text><text x="18" y="493" font-size="15" font-weight="400">御堂筋沿いの南北通り抜けができない。</text><text x="18" y="547" font-size="15" font-weight="700">夜の歩行者開放とは別。</text><text x="18" y="574" font-size="15" font-weight="400">車両規制は周辺の道路にも及ぶ。</text><text x="18" y="602" font-size="15" font-weight="400">規制時刻は当日の状況で変わり得る。</text><path d="M18,626 L342,626" fill="none" stroke="#cbd7e0" stroke-width="1"/><text x="18" y="654" font-size="15" font-weight="400">出典：大阪市、大阪府警　作図：アヤベ日報</text></g></svg>
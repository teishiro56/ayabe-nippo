<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 635" role="img"><title>改良酵素の反応活性と熱耐性</title><desc>活性2.2倍、10分処理の半減温度約57℃から約60℃、60℃での半減時間約13分から約19分。3段は別の指標と尺度で0起点。</desc><style>text{font-family:'Noto Sans CJK JP',sans-serif;fill:#233c3a;font-size:14px}.title{font-size:18px;font-weight:700}.small{font-size:12px}.value{font-size:16px;font-weight:700}</style><rect width="360" height="635" fill="#f3f5ef" rx="8"/><text class="title" x="18" y="32">酵素の改良は、3つの指標で</text><text x="18" y="57">野生型とYADH-LWFMYを比較</text><text x="18" y="100" font-weight="700">反応活性</text><text class="small" x="18" y="122">野生型を1とする倍率</text><text class="small" x="18" y="160">野生型</text><rect x="70" y="145" width="72.0" height="22" fill="#a7b8b2"/><text x="149.0" y="161">1.0</text><text class="small" x="18" y="195">改良型</text><rect x="70" y="180" width="158.40000000000003" height="22" fill="#247d71"/><text x="235.40000000000003" y="196">2.2</text><text class="small" x="70" y="224">0</text><text class="small" x="250" y="224" text-anchor="end">2.5</text><text x="18" y="252" font-weight="700">熱で活性が半減する温度</text><text class="small" x="18" y="274">10分間の熱処理・℃</text><text class="small" x="18" y="312">野生型</text><rect x="70" y="297" width="136.8" height="22" fill="#a7b8b2"/><text x="213.8" y="313">約57</text><text class="small" x="18" y="347">改良型</text><rect x="70" y="332" width="144.0" height="22" fill="#247d71"/><text x="221.0" y="348">約60</text><text class="small" x="70" y="376">0</text><text class="small" x="250" y="376" text-anchor="end">75</text><text x="18" y="404" font-weight="700">60℃で活性が半減する時間</text><text class="small" x="18" y="426">連続処理・分</text><text class="small" x="18" y="464">野生型</text><rect x="70" y="449" width="117.0" height="22" fill="#a7b8b2"/><text x="194.0" y="465">約13</text><text class="small" x="18" y="499">改良型</text><rect x="70" y="484" width="171.0" height="22" fill="#247d71"/><text x="248.0" y="500">約19</text><text class="small" x="70" y="528">0</text><text class="small" x="250" y="528" text-anchor="end">20</text><text x="18" y="563">各段は別の尺度。指標間で棒の長さを</text><text x="18" y="586">比較しない。実験段階の酵素研究。</text><text class="small" x="18" y="613">理研・2026年11月6日発表 図2、図3から作図</text></svg>
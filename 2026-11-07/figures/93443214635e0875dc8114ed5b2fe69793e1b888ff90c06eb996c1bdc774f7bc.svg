<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 508" role="img"><title>米国雇用統計の改定</title><desc>8月は133千人から186千人、9月は29千人から60千人へ上方修正。10月は初回165千人。全バーは0起点で同一尺度。</desc><style>text{font-family:'Noto Sans CJK JP',sans-serif;fill:#233c3a;font-size:14px}.title{font-size:18px;font-weight:700}.small{font-size:12px}.value{font-size:16px;font-weight:700}</style><rect width="360" height="508" fill="#f3f5ef" rx="8"/><text class="title" x="18" y="32">米雇用：過去2か月も上方修正</text><text x="18" y="57">非農業部門・前月比増加数／千人</text><rect x="18" y="77" width="13" height="13" fill="#a7b8b2"/><text x="37" y="89">従来値</text><rect x="128" y="77" width="13" height="13" fill="#247d71"/><text x="147" y="89">今回公表値</text><text x="18" y="132">8月</text><rect x="70" y="116" width="133" height="22" fill="#a7b8b2"/><text x="210" y="133">133</text><rect x="70" y="147" width="186" height="22" fill="#247d71"/><text class="value" x="263" y="164">186</text><text x="18" y="232">9月</text><rect x="70" y="216" width="29" height="22" fill="#a7b8b2"/><text x="106" y="233">29</text><rect x="70" y="247" width="60" height="22" fill="#247d71"/><text class="value" x="137" y="264">60</text><text x="18" y="332">10月</text><rect x="70" y="347" width="165" height="22" fill="#247d71"/><text class="value" x="242" y="364">165</text><text class="small" x="70" y="326">10月は初回推計</text><line x1="70" y1="384" x2="270" y2="384" stroke="#80938b"/><text class="small" x="70" y="403" text-anchor="middle">0</text><text class="small" x="170" y="403" text-anchor="middle">100</text><text class="small" x="270" y="403" text-anchor="middle">200</text><text x="18" y="438">8・9月の上方修正は合計84千人。</text><text x="18" y="461">10月の増加数に足す数字ではない。</text><text class="small" x="18" y="488">季節調整済み。BLS 2026年11月6日公表</text></svg>
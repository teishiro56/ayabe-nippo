<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1030" width="720" height="1030" role="img"><title>出生増より死亡減が自然減縮小に大きく寄与</title><desc>2025年と2026年の1月から6月、日本国内で発生した日本人の事象の概数比較。自然減の縮小57976人の内訳は死亡減56597人と出生増1379人。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#183a40" stroke-width="1.5"/></marker></defs><rect width="720" height="1030" rx="18" fill="#f7f5ee"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#183a40"><text x="32" y="55" font-size="34" fill="#183a40" font-weight="bold" text-anchor="start">自然減の縮小、何が変わった？</text><text x="32" y="102" font-size="29" fill="#4f605d" font-weight="normal" text-anchor="start">1〜6月の比較／日本国内の日本人・概数</text><text x="32" y="163" font-size="30" fill="#183a40" font-weight="bold" text-anchor="start">出生数</text><text x="390" y="163" font-size="30" fill="#183a40" font-weight="bold" text-anchor="start">死亡数</text><text x="32" y="213" font-size="29" fill="#183a40" font-weight="normal" text-anchor="start">2025年  319,079人</text><text x="390" y="213" font-size="29" fill="#183a40" font-weight="normal" text-anchor="start">823,343人</text><text x="32" y="260" font-size="29" fill="#183a40" font-weight="normal" text-anchor="start">2026年  320,458人</text><text x="390" y="260" font-size="29" fill="#183a40" font-weight="normal" text-anchor="start">766,746人</text><path d="M32 285L688 285" fill="none" stroke="#b6c5c2" stroke-width="3"/><text x="32" y="335" font-size="31" fill="#183a40" font-weight="bold" text-anchor="start">死亡 − 出生 ＝ 自然減</text><text x="32" y="385" font-size="29" fill="#183a40" font-weight="normal" text-anchor="start">2025年</text><rect x="32" y="403" width="504.264" height="52" rx="10" fill="#9daead" stroke="none" stroke-width="2"/><text x="556" y="439" font-size="28" fill="#183a40" font-weight="normal" text-anchor="start">504,264</text><text x="32" y="508" font-size="29" fill="#183a40" font-weight="normal" text-anchor="start">2026年</text><rect x="32" y="526" width="446.288" height="52" rx="10" fill="#2c6683" stroke="none" stroke-width="2"/><text x="498" y="562" font-size="28" fill="#183a40" font-weight="normal" text-anchor="start">446,288</text><text x="32" y="624" font-size="27" fill="#4f605d" font-weight="normal" text-anchor="start">棒の長さ：同じ尺度、左端は0人</text><text x="32" y="688" font-size="32" fill="#183a40" font-weight="bold" text-anchor="start">縮小した57,976人の内訳</text><rect x="32" y="714" width="624.7771491651717" height="66" rx="10" fill="#2c6683" stroke="none" stroke-width="2"/><rect x="656.7771491651717" y="714" width="15.222850834828204" height="66" rx="10" fill="#aa6829" stroke="none" stroke-width="2"/><text x="32" y="829" font-size="30" fill="#2c6683" font-weight="bold" text-anchor="start">■ 死亡減 56,597人</text><text x="32" y="874" font-size="30" fill="#aa6829" font-weight="bold" text-anchor="start">■ 出生増   1,379人</text><text x="32" y="930" font-size="28" fill="#4f605d" font-weight="normal" text-anchor="start">出生率や政策効果を示す図ではない。</text><text x="32" y="975" font-size="28" fill="#4f605d" font-weight="normal" text-anchor="start">出典：厚労省 人口動態統計月報 第1表</text><text x="32" y="1011" font-size="28" fill="#4f605d" font-weight="normal" text-anchor="start">2026年11月4日公表。本紙作図。</text></g></svg>

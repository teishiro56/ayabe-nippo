<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1340" width="720" height="1340" role="img"><title>議会を握っても、大統領は交代しない</title><desc>立法、政府人事、行政監視の三つの経路。法案は両院同文可決と大統領の判断が必要。議会多数派だけですべてを実行できない。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#183a40" stroke-width="1.5"/></marker></defs><rect width="720" height="1340" rx="18" fill="#f7f5ee"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#183a40"><text x="32" y="54" font-size="34" fill="#183a40" font-weight="bold" text-anchor="start">議会を握っても、大統領は交代しない</text><text x="32" y="98" font-size="30" fill="#4f605d" font-weight="normal" text-anchor="start">新議会の権限を読む模式図</text><rect x="32" y="126" width="656" height="100" rx="10" fill="#e1e9e7" stroke="none" stroke-width="2"/><text x="52" y="166" font-size="30" fill="#183a40" font-weight="bold" text-anchor="start">上下両院：民主党が多数派の見通し</text><text x="52" y="207" font-size="30" fill="#183a40" font-weight="normal" text-anchor="start">行政府：共和党のトランプ大統領</text><text x="32" y="280" font-size="32" fill="#183a40" font-weight="bold" text-anchor="start">① 法律・予算：両院と大統領の交渉</text><rect x="32" y="306" width="300" height="72" rx="10" fill="#dbe8ef" stroke="none" stroke-width="2"/><rect x="388" y="306" width="300" height="72" rx="10" fill="#dbe8ef" stroke="none" stroke-width="2"/><text x="182" y="352" font-size="30" fill="#183a40" font-weight="normal" text-anchor="middle">下院で可決</text><text x="538" y="352" font-size="30" fill="#183a40" font-weight="normal" text-anchor="middle">上院で可決</text><path d="M332 342L388 342" fill="none" stroke="#183a40" stroke-width="3"/><text x="360" y="407" font-size="29" fill="#183a40" font-weight="normal" text-anchor="middle">同じ内容の法案をそろえる</text><path d="M360 424L360 474" fill="none" stroke="#183a40" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="487" width="380" height="72" rx="10" fill="#f0dec6" stroke="none" stroke-width="2"/><text x="360" y="534" font-size="30" fill="#183a40" font-weight="normal" text-anchor="middle">大統領へ送付</text><path d="M240 559L160 618" fill="none" stroke="#183a40" stroke-width="3" marker-end="url(#arrow)"/><path d="M480 559L560 618" fill="none" stroke="#183a40" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="632" width="268" height="98" rx="10" fill="#e1e9e7" stroke="none" stroke-width="2"/><rect x="420" y="632" width="268" height="98" rx="10" fill="#f0dec6" stroke="none" stroke-width="2"/><text x="166" y="674" font-size="30" fill="#183a40" font-weight="normal" text-anchor="middle">署名 → 成立</text><text x="554" y="674" font-size="29" fill="#183a40" font-weight="normal" text-anchor="middle">拒否 → 議会へ</text><text x="166" y="712" font-size="28" fill="#4f605d" font-weight="normal" text-anchor="middle">通常の経路</text><text x="554" y="712" font-size="28" fill="#4f605d" font-weight="normal" text-anchor="middle">差し戻し</text><text x="32" y="780" font-size="29" fill="#183a40" font-weight="normal" text-anchor="start">拒否を覆すには両院それぞれ3分の2。</text><text x="32" y="822" font-size="29" fill="#183a40" font-weight="normal" text-anchor="start">上院は一般法案の審議終結に60票を</text><text x="32" y="862" font-size="29" fill="#183a40" font-weight="normal" text-anchor="start">要する場合も。単純多数だけでは足りない。</text><path d="M32 889L688 889" fill="none" stroke="#b6c5c2" stroke-width="3"/><text x="32" y="939" font-size="32" fill="#183a40" font-weight="bold" text-anchor="start">② 政府人事：上院に固有の判断</text><rect x="32" y="963" width="258" height="76" rx="10" fill="#f0dec6" stroke="none" stroke-width="2"/><rect x="400" y="963" width="288" height="76" rx="10" fill="#dbe8ef" stroke="none" stroke-width="2"/><text x="161" y="1012" font-size="29" fill="#183a40" font-weight="normal" text-anchor="middle">大統領が指名</text><text x="544" y="1012" font-size="29" fill="#183a40" font-weight="normal" text-anchor="middle">上院が承認／拒否</text><path d="M302 1000L388 1000" fill="none" stroke="#183a40" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="1081" font-size="29" fill="#183a40" font-weight="normal" text-anchor="start">対象：高官・連邦裁判官など。</text><path d="M32 1108L688 1108" fill="none" stroke="#b6c5c2" stroke-width="3"/><text x="32" y="1157" font-size="32" fill="#183a40" font-weight="bold" text-anchor="start">③ 行政監視：議会が説明を求める</text><text x="32" y="1203" font-size="29" fill="#183a40" font-weight="normal" text-anchor="start">委員会の調査・公聴会で、政策の実施を点検。</text><text x="32" y="1267" font-size="28" fill="#4f605d" font-weight="normal" text-anchor="start">制度の説明図。選挙の確定議席数ではない。</text><text x="32" y="1310" font-size="28" fill="#4f605d" font-weight="normal" text-anchor="start">米上下院の制度解説に基づき本紙作図</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1350" width="720" height="1350" role="img"><title>中身を渡さず、指定モデルの計算だと確かめる</title><desc>FlashProveの二段階。提供者が重みへの公開コミットメントを固定し、個々の入力出力に証明を添える。検証者は4情報を照合し内部の数値を受け取らない。事実性は保証しない。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#183a40" stroke-width="1.5"/></marker></defs><rect width="720" height="1350" rx="18" fill="#f7f5ee"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#183a40"><text x="32" y="54" font-size="34" fill="#183a40" font-weight="bold" text-anchor="start">「選んだAI」の計算だと確かめる</text><text x="32" y="100" font-size="30" fill="#4f605d" font-weight="normal" text-anchor="start">FlashProve／研究試作の模式図</text><text x="32" y="164" font-size="32" fill="#183a40" font-weight="bold" text-anchor="start">1  先にモデルを固定する</text><rect x="32" y="192" width="262" height="228" rx="10" fill="#dbe8ef" stroke="none" stroke-width="2"/><text x="52" y="234" font-size="30" fill="#183a40" font-weight="bold" text-anchor="start">提供者の内部</text><rect x="56" y="258" width="30" height="18" rx="10" fill="#2c6683" stroke="none" stroke-width="2"/><rect x="97" y="258" width="30" height="18" rx="10" fill="#82a7b5" stroke="none" stroke-width="2"/><rect x="138" y="258" width="30" height="18" rx="10" fill="#b8ced4" stroke="none" stroke-width="2"/><rect x="179" y="258" width="30" height="18" rx="10" fill="#2c6683" stroke="none" stroke-width="2"/><rect x="220" y="258" width="30" height="18" rx="10" fill="#82a7b5" stroke="none" stroke-width="2"/><rect x="56" y="287" width="30" height="18" rx="10" fill="#82a7b5" stroke="none" stroke-width="2"/><rect x="97" y="287" width="30" height="18" rx="10" fill="#b8ced4" stroke="none" stroke-width="2"/><rect x="138" y="287" width="30" height="18" rx="10" fill="#2c6683" stroke="none" stroke-width="2"/><rect x="179" y="287" width="30" height="18" rx="10" fill="#82a7b5" stroke="none" stroke-width="2"/><rect x="220" y="287" width="30" height="18" rx="10" fill="#b8ced4" stroke="none" stroke-width="2"/><rect x="56" y="316" width="30" height="18" rx="10" fill="#b8ced4" stroke="none" stroke-width="2"/><rect x="97" y="316" width="30" height="18" rx="10" fill="#2c6683" stroke="none" stroke-width="2"/><rect x="138" y="316" width="30" height="18" rx="10" fill="#82a7b5" stroke="none" stroke-width="2"/><rect x="179" y="316" width="30" height="18" rx="10" fill="#b8ced4" stroke="none" stroke-width="2"/><rect x="220" y="316" width="30" height="18" rx="10" fill="#2c6683" stroke="none" stroke-width="2"/><text x="52" y="383" font-size="27" fill="#183a40" font-weight="normal" text-anchor="start">重み＝内部の数値</text><path d="M310 298L390 298" fill="none" stroke="#183a40" stroke-width="3" marker-end="url(#arrow)"/><rect x="410" y="192" width="278" height="228" rx="10" fill="#e1e9e7" stroke="none" stroke-width="2"/><text x="430" y="235" font-size="30" fill="#183a40" font-weight="bold" text-anchor="start">公開する情報</text><text x="430" y="294" font-size="29" fill="#183a40" font-weight="bold" text-anchor="start">コミットメント</text><text x="430" y="340" font-size="29" fill="#183a40" font-weight="normal" text-anchor="start">同じ重みを固定</text><text x="430" y="382" font-size="29" fill="#183a40" font-weight="normal" text-anchor="start">する「指紋」</text><text x="32" y="470" font-size="30" fill="#183a40" font-weight="normal" text-anchor="start">重みそのものは、検証者に渡さない。</text><path d="M32 500L688 500" fill="none" stroke="#b6c5c2" stroke-width="3"/><text x="32" y="553" font-size="32" fill="#183a40" font-weight="bold" text-anchor="start">2  個々の計算に、証明を添える</text><rect x="32" y="578" width="656" height="102" rx="10" fill="#dbe8ef" stroke="none" stroke-width="2"/><text x="52" y="620" font-size="30" fill="#183a40" font-weight="bold" text-anchor="start">提供者が計算 → 証明を作成</text><text x="52" y="660" font-size="29" fill="#183a40" font-weight="normal" text-anchor="start">中間計算や専門モデルの選択も秘匿</text><path d="M360 684L360 729" fill="none" stroke="#183a40" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="776" font-size="31" fill="#183a40" font-weight="bold" text-anchor="start">検証者に必要な4点セット</text><rect x="32" y="800" width="304" height="67" rx="10" fill="#e1e9e7" stroke="none" stroke-width="2"/><text x="47" y="844" font-size="27" fill="#183a40" font-weight="normal" text-anchor="start">① 公開コミットメント</text><rect x="384" y="800" width="304" height="67" rx="10" fill="#e1e9e7" stroke="none" stroke-width="2"/><text x="399" y="844" font-size="27" fill="#183a40" font-weight="normal" text-anchor="start">② 入力文</text><rect x="32" y="885" width="304" height="67" rx="10" fill="#e1e9e7" stroke="none" stroke-width="2"/><text x="47" y="929" font-size="27" fill="#183a40" font-weight="normal" text-anchor="start">③ 出力文</text><rect x="384" y="885" width="304" height="67" rx="10" fill="#e1e9e7" stroke="none" stroke-width="2"/><text x="399" y="929" font-size="27" fill="#183a40" font-weight="normal" text-anchor="start">④ 証明ファイル</text><path d="M360 965L360 1003" fill="none" stroke="#183a40" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="1020" width="656" height="110" rx="10" fill="#183a40" stroke="none" stroke-width="2"/><text x="360" y="1063" font-size="29" fill="#ffffff" font-weight="normal" text-anchor="middle">固定した整数モデルの計算との</text><text x="360" y="1106" font-size="29" fill="#ffffff" font-weight="normal" text-anchor="middle">一致を検証（最高得点の語片を選択）</text><text x="32" y="1183" font-size="30" fill="#183a40" font-weight="bold" text-anchor="start">一致しても、文章が正しい保証ではない。</text><text x="32" y="1228" font-size="28" fill="#183a40" font-weight="normal" text-anchor="start">入力・出力やモデル構造は秘匿対象ではない。</text><text x="32" y="1285" font-size="26" fill="#4f605d" font-weight="normal" text-anchor="start">格子は数値を表す模式表現。実データではない。</text><text x="32" y="1326" font-size="28" fill="#4f605d" font-weight="normal" text-anchor="start">出典：Anthropic公式解説・技術報告 §5.3</text></g></svg>

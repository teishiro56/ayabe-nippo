<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1450" viewBox="0 0 720 1450" role="img" aria-labelledby="title desc">
<title id="title">日本海溝、浅部の再固着と深部の変形</title>
<desc id="desc">海底26地点、2011年から2025年までの14年間の観測に基づく概念図。海側プレートが陸側の下へ沈む境界で、浅部は再び固着する一方、深部ではゆっくりした滑りと岩石の変形が続く。大きく滑った中心域は震災後早期、周辺の浅部は約10年で固着が回復した。距離、深さ、時間の長さは非比例で、地震発生日を予測する図ではない。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34677d"/></marker>
  <style>text{font-family:'Noto Sans CJK JP',sans-serif;fill:#172b37;font-size:30px} .bold{font-weight:700}.small{font-size:28px}.green{fill:#126b58}.blue{fill:#34677d}</style>
</defs>
<rect width="720" height="1450" rx="16" fill="#f5f3eb"/>
<text x="36" y="60" font-size="36" class="bold">浅部は再び固着、深部は動き続ける</text>
<text x="36" y="108" class="small">2011～2025年・14年間の海底観測</text>
<rect x="36" y="135" width="648" height="78" rx="12" fill="#fff"/>
<text x="58" y="186" class="bold">海底26地点</text>
<text x="260" y="186" class="small">陸上・小地震の記録も解析</text>
<text x="36" y="264" class="bold">境界での動きは、深さによって違う</text>
<text x="36" y="306" class="small">断面模式図：距離・深さは非比例</text>
<!-- Original schematic. East is right; the oceanic plate dips westward. -->
<rect x="36" y="335" width="648" height="280" rx="8" fill="#e6e1d4"/>
<path d="M36 380 L270 380 L520 430 L684 430 L684 335 L270 335 L270 380 Z" fill="#deedf2"/>
<path d="M36 380 L270 380 L520 430 L100 610 L36 610 Z" fill="#d4d3bf"/>
<path d="M100 610 L520 430 L684 430 L684 475 L538 475 L196 615 L100 615 Z" fill="#b4cbd5"/>
<path d="M100 610 L520 430 L684 430" fill="none" stroke="#52656a" stroke-width="5"/>
<path d="M336 509 L500 438" fill="none" stroke="#126b58" stroke-width="15"/>
<path d="M130 597 L310 520" fill="none" stroke="#34677d" stroke-width="12" stroke-dasharray="17 13"/>
<text x="55" y="371" class="bold">陸側</text>
<text x="595" y="373" class="bold">海側</text>
<text x="65" y="458" class="small">陸側プレート</text>
<text x="378" y="571" class="small">海側プレート</text>
<path d="M635 494 L560 526" fill="none" stroke="#34677d" stroke-width="6" marker-end="url(#arrow)"/>
<circle cx="475" cy="474" r="25" fill="#126b58"/><text x="466" y="485" style="fill:white" class="bold">1</text>
<circle cx="258" cy="572" r="25" fill="#34677d"/><text x="249" y="583" style="fill:white" class="bold">2</text>
<text x="36" y="661" class="bold green">1　浅部：引っ掛かりが戻る</text>
<text x="84" y="706" class="small">海側に引かれ、再びひずみを蓄える</text>
<text x="36" y="756" class="bold blue">2　深部：ゆっくりした滑りが続く</text>
<text x="84" y="801" class="small">地下深部の岩石の変形も続く</text>
<path d="M36 836 H684" stroke="#bcc4bf" stroke-width="2"/>
<text x="36" y="881" class="bold">固着が戻る時期も一様ではない</text>
<rect x="36" y="908" width="648" height="104" rx="10" fill="#e0eee7"/>
<text x="56" y="950" class="bold">大きく滑った中心域</text>
<text x="56" y="991" class="green">震災後早期に固着が回復</text>
<rect x="36" y="1026" width="648" height="104" rx="10" fill="#e0eee7"/>
<text x="56" y="1068" class="bold">周辺の浅部</text>
<text x="56" y="1109" class="green">約10年で回復（2021年ごろ）</text>
<rect x="36" y="1144" width="648" height="80" rx="10" fill="#e1ebf0"/>
<text x="56" y="1195" class="blue">深部は、その後も滑り・変形が継続</text>
<text x="36" y="1272" class="small">矢印は方向のみ。速度・移動量は示さない。</text>
<text x="36" y="1315" class="bold">地震の発生日を予測した研究ではない。</text>
<text x="36" y="1371" class="small">出典：東北大学ほか、11月6日公開資料</text>
<text x="36" y="1414" class="small">p2–3・図3–4 ／ アヤベ日報独自作図</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="350" height="610" viewBox="0 0 350 610" role="img" aria-labelledby="title desc">
<title id="title">藤沢市のクビアカツヤカミキリ局所根絶までの確認</title>
<desc id="desc">2021年発見後に成虫捕獲と被害木伐採。2021年から25年に年2回、周囲約200メートルのサクラ500本強を調査。2026年6月まで羽化やフラス発生がなく局所根絶と判断。時間の間隔は模式的。</desc>
<rect width="350" height="610" rx="16" fill="#f5f3eb"/>
<g font-family="Noto Sans CJK JP, sans-serif" fill="#192d28">
<text x="20" y="33" font-size="19" font-weight="700">駆除の後も、確認を続ける</text>
<text x="20" y="60" font-size="15">藤沢市・大学構内の局所的な事例</text>
<path d="M44 104 V500" fill="none" stroke="#90a69b" stroke-width="3"/>
<circle cx="44" cy="110" r="8" fill="#a15236"/>
<text x="66" y="108" font-size="18" font-weight="700">2021年6月　発見</text>
<text x="66" y="135" font-size="15">被害木10本以下の初期段階</text>
<text x="66" y="161" font-size="15">成虫捕獲・被害木の早期伐採</text>
<rect x="65" y="192" width="264" height="227" rx="12" fill="#e1eadd"/>
<text x="80" y="222" font-size="18" font-weight="700">2021〜2025年</text>
<text x="80" y="251" font-size="17" font-weight="700">年2回のモニタリング</text>
<text x="80" y="281" font-size="15">範囲：発生地の周囲 約200m</text>
<text x="80" y="308" font-size="15">対象：サクラ類 500本強</text>
<text x="80" y="346" font-size="14">2021　22　23　24　25</text>
<g fill="#456d52"><circle cx="88" cy="369" r="4"/><circle cx="99" cy="369" r="4"/><circle cx="132" cy="369" r="4"/><circle cx="143" cy="369" r="4"/><circle cx="175" cy="369" r="4"/><circle cx="186" cy="369" r="4"/><circle cx="218" cy="369" r="4"/><circle cx="229" cy="369" r="4"/><circle cx="260" cy="369" r="4"/><circle cx="271" cy="369" r="4"/></g>
<text x="80" y="398" font-size="14">● ● は各年2回の調査を表す</text>
<circle cx="44" cy="470" r="8" fill="#456d52"/>
<text x="66" y="465" font-size="18" font-weight="700">2026年6月　根絶判断</text>
<text x="66" y="493" font-size="15">この時点まで羽化や幼虫の</text>
<text x="66" y="519" font-size="15">排出物（フラス）を確認せず</text>
<path d="M20 543 H330" stroke="#c3cbc2"/>
<text x="20" y="568" font-size="14">全国での根絶を意味するものではない。</text>
<text x="20" y="591" font-size="14">工程を示した模式図。時間間隔は非比例。</text>
</g></svg>

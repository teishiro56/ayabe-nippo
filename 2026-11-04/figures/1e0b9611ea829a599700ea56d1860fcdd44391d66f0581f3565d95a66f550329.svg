<svg xmlns="http://www.w3.org/2000/svg" width="680" height="660" viewBox="0 0 680 660" role="img" aria-labelledby="title desc"><title id="title">豪州政策金利、2026年に5回の利上げ</title><desc id="desc">年初3.60パーセントから11月4日適用の4.85パーセントへ。縦軸は3.5から5.0パーセント。日付は適用日。</desc><rect width="680" height="660" fill="#f2f6f2"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#203d35"><text x="30" y="48" font-size="32" font-weight="bold">5回の利上げ、計1.25ポイント</text><text x="30" y="90" font-size="28">RBA政策金利｜2026年・適用日</text><path d="M90 475.0H615" stroke="#bccbc2"/><text x="74" y="485.0" text-anchor="end" font-size="28">3.5</text><path d="M90 365.0H615" stroke="#bccbc2"/><text x="74" y="375.0" text-anchor="end" font-size="28">4.0</text><path d="M90 255.0H615" stroke="#bccbc2"/><text x="74" y="265.0" text-anchor="end" font-size="28">4.5</text><path d="M90 145.0H615" stroke="#bccbc2"/><text x="74" y="155.0" text-anchor="end" font-size="28">5.0</text><path d="M90.0,453.0H148.1V398.0H220.0V343.0H303.8V288.0H375.6V288.0H471.4V288.0H555.1V233.0H615.0V178.0" fill="none" stroke="#246855" stroke-width="5"/><circle cx="90.0" cy="453.0" r="5" fill="#246855"/><circle cx="148.1" cy="398.0" r="5" fill="#246855"/><circle cx="220.0" cy="343.0" r="5" fill="#246855"/><circle cx="303.8" cy="288.0" r="5" fill="#246855"/><circle cx="375.6" cy="288.0" r="5" fill="#246855"/><circle cx="471.4" cy="288.0" r="5" fill="#246855"/><circle cx="555.1" cy="233.0" r="5" fill="#246855"/><circle cx="615.0" cy="178.0" r="5" fill="#246855"/><text x="90.0" y="515" text-anchor="middle" font-size="28">1月</text><text x="295.21172638436485" y="515" text-anchor="middle" font-size="28">5月</text><text x="505.5537459283388" y="515" text-anchor="middle" font-size="28">9月</text><text x="615.0" y="515" text-anchor="middle" font-size="28">11/4</text><text x="190" y="450" font-size="30" font-weight="bold">3.60％</text><text x="514" y="150" font-size="30" font-weight="bold">4.85％</text><text x="30" y="566" font-size="28">縦軸は3.5％始まり。0％は省略。</text><text x="30" y="606" font-size="28">6月・8月は据え置き。</text><text x="30" y="645" font-size="25">出典：RBA公式時系列／アヤベ日報作図</text></g></svg>
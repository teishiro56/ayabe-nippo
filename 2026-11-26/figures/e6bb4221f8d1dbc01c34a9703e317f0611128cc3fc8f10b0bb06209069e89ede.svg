<svg xmlns="http://www.w3.org/2000/svg" width="390" height="278" viewBox="0 0 390 278" role="img" aria-labelledby="t d"><title id="t">ディモルフォスの衝突前後の模式図</title><desc id="d">衝突前は丸みのある面。衝突後には同じ側に大きなくぼみが見える。非縮尺。</desc><rect width="390" height="278" rx="14" fill="#edf4f7"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#192f43"><text x="18" y="32" font-size="22" font-weight="bold" text-anchor="start" fill="#192f43">小惑星の同じ側を見比べる</text><text x="18" y="58" font-size="17" font-weight="normal" text-anchor="start" fill="#192f43">ディモルフォスの形・模式図</text><text x="100" y="91" font-size="17" font-weight="bold" text-anchor="middle" fill="#192f43">2022年：衝突前</text><text x="289" y="91" font-size="17" font-weight="bold" text-anchor="middle" fill="#192f43">2026年：撮影</text><path d="M52 163q-8-41 37-57q32-15 57 12q22 25 9 53q-17 35-63 25q-32-9-40-33z" fill="#aab9c4" stroke="#42596b" stroke-width="3"/><path d="M68 147l24 11 21-11m-40 27 11-6 21 7" fill="none" stroke="#728695" stroke-width="3"/><path d="M242 123q52-39 88-8q24 21 9 53q-13 28-51 29q-32 1-47-26q-6-12-3-24z" fill="#aab9c4" stroke="#42596b" stroke-width="3"/><path d="M242 122q15 14 8 52m-8-52q-17 28-3 50q8 10 11 2" fill="#b67834" stroke="#754211" stroke-width="3"/><path d="M206 160l33-4" stroke="#754211" stroke-width="2"/><circle cx="240" cy="156" r="3" fill="#754211"/><text x="100" y="224" font-size="17" font-weight="normal" text-anchor="middle" fill="#192f43">丸みのある面</text><text x="289" y="224" font-size="17" font-weight="normal" text-anchor="middle" fill="#192f43">平たく見える衝突面</text><text x="18" y="257" font-size="16" font-weight="normal" text-anchor="start" fill="#192f43">形状や凹みの深さは縮尺どおりではない</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="246" viewBox="0 0 390 246" role="img" aria-labelledby="t d"><title id="t">介護保険料の移行イメージ</title><desc id="d">年6万円から本来8万円になる例。移行年は7万円、翌年は8万円。実額ではない。</desc><rect width="390" height="246" rx="14" fill="#edf4f7"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#192f43"><text x="18" y="34" font-size="21" font-weight="bold" text-anchor="start" fill="#192f43">課税世帯に移るときの保険料</text><text x="18" y="61" font-size="17" font-weight="normal" text-anchor="start" fill="#192f43">報道された案・説明用の架空例</text><text x="18" y="103" font-size="17" font-weight="bold" text-anchor="start" fill="#192f43">移る前</text><rect x="113" y="86" width="144" height="22" rx="3" fill="#2c6376"/><text x="267" y="103" font-size="17" font-weight="bold" text-anchor="start" fill="#192f43">6万円</text><text x="18" y="147" font-size="17" font-weight="bold" text-anchor="start" fill="#192f43">最初の年</text><rect x="113" y="130" width="144" height="22" rx="3" fill="#2c6376"/><rect x="257" y="130" width="24" height="22" rx="3" fill="#98631b"/><text x="291" y="147" font-size="17" font-weight="bold" text-anchor="start" fill="#192f43">7万円</text><text x="18" y="191" font-size="17" font-weight="bold" text-anchor="start" fill="#192f43">次の年</text><rect x="113" y="174" width="144" height="22" rx="3" fill="#2c6376"/><rect x="257" y="174" width="48" height="22" rx="3" fill="#98631b"/><text x="315" y="191" font-size="17" font-weight="bold" text-anchor="start" fill="#192f43">8万円</text><text x="18" y="226" font-size="16" font-weight="normal" text-anchor="start" fill="#192f43">最初の年だけ、増える2万円の半分を抑制</text></g></svg>
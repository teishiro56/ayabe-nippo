<svg xmlns="http://www.w3.org/2000/svg" width="360" height="820" viewBox="0 0 360 820" role="img" aria-labelledby="title desc"><title id="title">9月の家計支出は実質6.8%減、減少は食料以外にも広がる</title><desc id="desc">二人以上世帯の2026年1月から9月の実質消費支出前年同月比の折れ線と、9月の主な費目の寄与度。各月はいずれもマイナスで、減少率は順に1.1、1.8、2.9、0.5、0.4、3.3、3.6、3.1、6.8%。寄与度も全てマイナスで、交通通信1.41、教育0.94、教養娯楽0.88、食料0.77、光熱水道0.77ポイントの押し下げ。費目は抜粋で合計を示さない。</desc><rect width="360" height="100%" rx="12" fill="#f3f1e9"/><g font-family="Noto Sans CJK JP,sans-serif">
<text x="20" y="34" font-size="19" font-weight="700" text-anchor="start" fill="#203c43">9月、家計支出の落ち込みが拡大</text>
<text x="20" y="60" font-size="14" font-weight="400" text-anchor="start" fill="#203c43">二人以上世帯／2026年／前年同月比</text>
<rect x="16" y="80" width="328" height="286" rx="10" fill="#fff"/>
<text x="30" y="107" font-size="16" font-weight="700" text-anchor="start" fill="#203c43">① 全体の実質増減率</text>
<line x1="48" y1="144" x2="308" y2="144" stroke="#cbd4d0"/>
<text x="40" y="149" font-size="14" font-weight="400" text-anchor="end" fill="#203c43">0%</text>
<line x1="48" y1="188" x2="308" y2="188" stroke="#cbd4d0"/>
<text x="40" y="193" font-size="14" font-weight="400" text-anchor="end" fill="#203c43">-2%</text>
<line x1="48" y1="232" x2="308" y2="232" stroke="#cbd4d0"/>
<text x="40" y="237" font-size="14" font-weight="400" text-anchor="end" fill="#203c43">-4%</text>
<line x1="48" y1="276" x2="308" y2="276" stroke="#cbd4d0"/>
<text x="40" y="281" font-size="14" font-weight="400" text-anchor="end" fill="#203c43">-6%</text>
<line x1="48" y1="320" x2="308" y2="320" stroke="#cbd4d0"/>
<text x="40" y="325" font-size="14" font-weight="400" text-anchor="end" fill="#203c43">-8%</text>
<polyline points="48,168.2 80,183.6 112,207.8 144,155.0 176,152.8 208,216.6 240,223.2 272,212.2 304,293.6" fill="none" stroke="#315e55" stroke-width="3"/>
<circle cx="48" cy="168.2" r="3.4" fill="#315e55"/>
<text x="48" y="345" font-size="14" font-weight="400" text-anchor="middle" fill="#203c43">1</text>
<circle cx="80" cy="183.6" r="3.4" fill="#315e55"/>
<text x="80" y="345" font-size="14" font-weight="400" text-anchor="middle" fill="#203c43">2</text>
<circle cx="112" cy="207.8" r="3.4" fill="#315e55"/>
<text x="112" y="345" font-size="14" font-weight="400" text-anchor="middle" fill="#203c43">3</text>
<circle cx="144" cy="155.0" r="3.4" fill="#315e55"/>
<text x="144" y="345" font-size="14" font-weight="400" text-anchor="middle" fill="#203c43">4</text>
<circle cx="176" cy="152.8" r="3.4" fill="#315e55"/>
<text x="176" y="345" font-size="14" font-weight="400" text-anchor="middle" fill="#203c43">5</text>
<circle cx="208" cy="216.6" r="3.4" fill="#315e55"/>
<text x="208" y="345" font-size="14" font-weight="400" text-anchor="middle" fill="#203c43">6</text>
<circle cx="240" cy="223.2" r="3.4" fill="#315e55"/>
<text x="240" y="345" font-size="14" font-weight="400" text-anchor="middle" fill="#203c43">7</text>
<circle cx="272" cy="212.2" r="3.4" fill="#315e55"/>
<text x="272" y="345" font-size="14" font-weight="400" text-anchor="middle" fill="#203c43">8</text>
<circle cx="304" cy="293.6" r="3.4" fill="#315e55"/>
<text x="304" y="345" font-size="14" font-weight="400" text-anchor="middle" fill="#203c43">9</text>
<text x="326" y="345" font-size="14" font-weight="400" text-anchor="start" fill="#203c43">月</text>
<text x="290" y="279.6" font-size="17" font-weight="700" text-anchor="end" fill="#203c43">−6.8%</text>
<text x="20" y="398" font-size="16" font-weight="700" text-anchor="start" fill="#203c43">② 9月の主な押し下げ項目</text>
<text x="20" y="422" font-size="14" font-weight="400" text-anchor="start" fill="#203c43">全体の実質増減率への寄与度（ポイント）</text>
<text x="20" y="446" font-size="14" font-weight="400" text-anchor="start" fill="#203c43">抜粋。費目そのものの減少率ではない。</text>
<text x="20" y="487" font-size="15" font-weight="400" text-anchor="start" fill="#203c43">交通・通信</text>
<rect x="122" y="469" width="157.92" height="21" rx="2" fill="#b56b3e"/>
<text x="285.91999999999996" y="486" font-size="14" font-weight="700" text-anchor="start" fill="#203c43">−1.41</text>
<text x="20" y="530" font-size="15" font-weight="400" text-anchor="start" fill="#203c43">教育</text>
<rect x="122" y="512" width="105.28" height="21" rx="2" fill="#b56b3e"/>
<text x="233.28" y="529" font-size="14" font-weight="700" text-anchor="start" fill="#203c43">−0.94</text>
<text x="20" y="573" font-size="15" font-weight="400" text-anchor="start" fill="#203c43">教養娯楽</text>
<rect x="122" y="555" width="98.56" height="21" rx="2" fill="#b56b3e"/>
<text x="226.56" y="572" font-size="14" font-weight="700" text-anchor="start" fill="#203c43">−0.88</text>
<text x="20" y="616" font-size="15" font-weight="400" text-anchor="start" fill="#203c43">食料</text>
<rect x="122" y="598" width="86.24" height="21" rx="2" fill="#b56b3e"/>
<text x="214.24" y="615" font-size="14" font-weight="700" text-anchor="start" fill="#203c43">−0.77</text>
<text x="20" y="659" font-size="15" font-weight="400" text-anchor="start" fill="#203c43">光熱・水道</text>
<rect x="122" y="641" width="86.24" height="21" rx="2" fill="#b56b3e"/>
<text x="214.24" y="658" font-size="14" font-weight="700" text-anchor="start" fill="#203c43">−0.77</text>
<text x="20" y="711" font-size="15" font-weight="700" text-anchor="start" fill="#203c43">名目支出も9月は4.5％減。</text>
<text x="20" y="738" font-size="14" font-weight="400" text-anchor="start" fill="#203c43">物価調整後の減少だけではありません。</text>
<text x="20" y="775" font-size="14" font-weight="400" text-anchor="start" fill="#203c43">出典：総務省「家計調査」9月分、1〜2頁</text>
<text x="20" y="802" font-size="14" font-weight="400" text-anchor="start" fill="#203c43">11月10日公表／アヤベ日報作成</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="476" viewBox="0 0 360 476" role="img" aria-labelledby="title desc"><title id="title">将来の100万円を、いまの価値に換算</title><desc id="desc">年4%の社会的割引率による計算例。各時点に一度だけ生じる100万円の便益は、現在価値で0年100、10年67.6、20年45.6、30年30.8、50年14.1万円。価格変動を除いた実質価格での比較。</desc><style>text{font-family:'Noto Sans CJK JP',sans-serif;fill:#172d39;font-size:14px}.head{font-size:20px;font-weight:700}.bold{font-weight:700}.muted{fill:#455d68}</style><rect width="360" height="476" fill="#f5f4ed"/><text x="18" y="32" class="head">将来の100万円の「いま」</text><text x="18" y="59">年4%で換算した現在価値（万円）</text><text x="18" y="86" class="muted">各時点に一度だけ生じる便益の比較</text><text x="18" y="113" class="muted">物価変動を除いた実質価格で計算</text><text x="18" y="169">いま</text><rect x="82" y="151" width="204" height="25" fill="#e1e6e1"/><rect x="82" y="151" width="204.0" height="25" fill="#196f66"/><text x="342" y="169" text-anchor="end" class="bold">100</text><text x="18" y="217">10年後</text><rect x="82" y="199" width="204" height="25" fill="#e1e6e1"/><rect x="82" y="199" width="137.904" height="25" fill="#196f66"/><text x="342" y="217" text-anchor="end" class="bold">67.6</text><text x="18" y="265">20年後</text><rect x="82" y="247" width="204" height="25" fill="#e1e6e1"/><rect x="82" y="247" width="93.024" height="25" fill="#196f66"/><text x="342" y="265" text-anchor="end" class="bold">45.6</text><text x="18" y="313">30年後</text><rect x="82" y="295" width="204" height="25" fill="#e1e6e1"/><rect x="82" y="295" width="62.832" height="25" fill="#196f66"/><text x="342" y="313" text-anchor="end" class="bold">30.8</text><text x="18" y="361">50年後</text><rect x="82" y="343" width="204" height="25" fill="#e1e6e1"/><rect x="82" y="343" width="28.764" height="25" fill="#196f66"/><text x="342" y="361" text-anchor="end" class="bold">14.1</text><text x="18" y="402">計算式：100 ÷ (1.04)ⁿ　n＝年数</text><path d="M18 419H342" stroke="#c0c9c9"/><text x="18" y="443">4%は現行指針の社会的割引率。</text><text x="18" y="465">物価上昇率ではなく、新率は未決定。</text></svg>
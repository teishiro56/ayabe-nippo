<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img"><title>核の硬さと遺伝子活性化の関係</title><rect width="360" height="650" fill="#f5f2e9"/><g font-family="system-ui, Noto Sans CJK JP, sans-serif" fill="#233c38"><text x="18" y="30" font-size="18" font-weight="700">硬さを変え、遺伝子の動きを調べる</text><text x="18" y="56" font-size="16" >マウス初期胚の実験・模式図</text><text x="18" y="92" font-size="17" font-weight="700">① 観察：2細胞期の核は柔らかい</text><ellipse cx="76" cy="147" rx="46" ry="35" fill="#dce5dc" stroke="#315e55" stroke-width="2"/><ellipse cx="76" cy="147" rx="40" ry="29" fill="none" stroke="#a27a48" stroke-width="3" stroke-dasharray="9 13"/><path d="M53,140 q15,-20 29,2 t17,8 M58,161 q18,-19 32,4" fill="none" stroke="#68739a" stroke-width="3"/><path d="M12,137 L39,137 L39,155 L12,155" fill="#b5cbd4" stroke="#657d86"/><text x="151" y="137" font-size="16" >細いガラス管で</text><text x="151" y="162" font-size="16" >核を引っ張り、</text><text x="151" y="187" font-size="14" >変形のしやすさを測る</text><text x="18" y="214" font-size="15" >核の支えとなるラミンB1が減る</text><line x1="18" y1="234" x2="342" y2="234" stroke="#b7c3b8"/><text x="18" y="265" font-size="17" font-weight="700">② 操作A：支えを残す・増やす</text><ellipse cx="76" cy="321" rx="46" ry="35" fill="#dce5dc" stroke="#315e55" stroke-width="2"/><ellipse cx="76" cy="321" rx="40" ry="29" fill="none" stroke="#a27a48" stroke-width="6" /><path d="M53,314 q15,-20 29,2 t17,8 M58,335 q18,-19 32,4" fill="none" stroke="#68739a" stroke-width="3"/><text x="149" y="304" font-size="16" >ラミンB1を保持</text><text x="149" y="331" font-size="16" >核が硬くなる</text><text x="149" y="358" font-size="14" >遺伝子の活性化が不十分</text><line x1="18" y1="388" x2="342" y2="388" stroke="#b7c3b8"/><text x="18" y="419" font-size="17" font-weight="700">③ 操作B：別の方法でも硬くする</text><ellipse cx="76" cy="476" rx="46" ry="35" fill="#dce5dc" stroke="#315e55" stroke-width="2"/><ellipse cx="76" cy="476" rx="40" ry="29" fill="none" stroke="#a27a48" stroke-width="3" stroke-dasharray="9 13"/><path d="M53,469 q15,-20 29,2 t17,8 M58,490 q18,-19 32,4" fill="none" stroke="#68739a" stroke-width="3"/><path d="M51,455 L96,497 M51,497 L101,455" stroke="#74639a" stroke-width="3"/><text x="149" y="459" font-size="16" >人工的な分子のつなぎ</text><text x="149" y="486" font-size="16" >核内の活動を制限</text><text x="149" y="513" font-size="14" >主要な遺伝子発現が抑制</text><text x="18" y="556" font-size="17" font-weight="700">別の硬化操作でも、活性化を妨げた。</text><text x="18" y="583" font-size="14" >実物の形・寸法や定量値ではありません。</text><text x="18" y="608" font-size="14" >出典：九州大学／Nature論文要旨</text><text x="18" y="632" font-size="14" >本紙作成。人の治療効果を示す図ではない。</text></g></svg>